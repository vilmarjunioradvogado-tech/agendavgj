?'AUTÔNOMO':'MANUAL'}</span></div><div class="wa-queue"><div><strong>Fila de Vilmar</strong><span class="badge">${waIndividualChats().filter(x=>['aguardando_vilmar','pendencia','agendado'].includes(x.agentStatus)).length}</span></div><div class="wa-note">Conversas que já foram triadas e aguardam análise humana ou possuem pendências.</div></div>${chats.length?`<div class="wa-inbox"><aside class="wa-sidebar"><div class="wa-search"><input id="waChatSearch" placeholder="Pesquisar conversa..."></div><div class="wa-chatlist" id="waChatList">${chats.map(x=>{const last=msgs.filter(m=>m.chatId===x.id).slice(-1)[0];const unread=Number(x.wa_unreadCount||0);return `<button class="wa-chatrow ${x.id===selected?'selected':''}" data-action="wa-select" data-id="${esc(x.id)}"><div class="wa-avatar">${esc((x.name||x.wa_contactName||x.phone||'?').slice(0,2).toUpperCase())}</div><div style="min-width:0"><strong style="font-size:12px">${esc(x.name||x.wa_contactName||x.wa_name||x.phone||'Sem nome')}</strong><div class="wa-last">${esc(x.wa_lastMessageText||last?.text||'Sem mensagens carregadas')}</div></div>${unread?`<span class="wa-unread">${unread>99?'99+':unread}</span>`:''}</button>`}).join('')}</div></aside><section class="wa-main">${c?`<div class="wa-mainhead"><div><strong>${esc(c.name||c.wa_contactName||c.wa_name||c.phone||'Conversa')}</strong><div class="wa-note">${esc(c.phone||'')} ${c.lead_status?`· ${esc(c.lead_status)}`:''}</div></div><div class="row"><button class="btn small" data-action="wa-agent" data-id="${esc(c.id)}">IA</button><button class="btn small" data-action="wa-mark-read" data-id="${esc(c.id)}">Ler</button></div></div><div class="wa-thread-inline">${thread.length?thread.map(m=>`<div class="wa-bubble ${m.direction==='out'?'out':'in'}">${esc(m.text||'')}<span class="wa-time">${m.at?new Date(m.at).toLocaleString('pt-BR'):''}</span></div>`).join(''):'<div class="empty"><strong>Conversa ainda não carregada</strong>Clique em “Sincronizar conversas” para buscar as mensagens da Zappfy.</div>'}</div><div class="wa-compose-inline"><textarea id="waInlineText" placeholder="Digite a resposta..."></textarea><button class="btn primary" data-action="wa-inline-send" data-id="${esc(c.id)}">Enviar</button></div>`:'<div class="empty" style="margin:auto"><strong>Nenhuma conversa selecionada</strong>Sincronize os chats da Zappfy.</div>'}</section></div>`:`<div class="empty"><strong>Nenhuma conversa carregada</strong>Clique em <strong>Sincronizar conversas</strong> para importar a lista de chats da Zappfy.</div>`}<div id="waSyncBox" style="margin-top:12px"></div><div class="wa-note" style="margin-top:10px">Agente autônomo: o navegador sincroniza enquanto o NAVE estiver aberto. Para atendimento 24/7 com o navegador fechado, é necessário webhook/SSE ligado a um backend/relay público. Grupos do WhatsApp são bloqueados pelo NAVE: não aparecem no inbox, não entram na triagem da IA e não recebem mensagens automáticas. A lista de conversas usa o endpoint oficial <span class="mono">POST /chat/find</span> da Zappfy. O atendimento acontece neste painel; selecionar uma conversa carrega seu histórico e o campo inferior envia a resposta.</div></div>`}
async function waSyncChats(silent=false){const w=waConfig();if(!w.token){if(!silent)toast('Configure o token Zappfy primeiro');return false}try{const r=await apiFetch((w.baseUrl||'https://api.zappfy.io')+'/chat/find',{method:'POST',headers:{'Content-Type':'application/json',token:w.token},body:JSON.stringify({operator:'AND',sort:'-wa_lastMsgTimestamp',limit:200,offset:0})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||j.message||'HTTP '+r.status);const raw=Array.isArray(j.chats)?j.chats:(Array.isArray(j.data)?j.data:(Array.isArray(j.results)?j.results:(Array.isArray(j.items)?j.items:[])));const incoming=raw.filter(x=>!waIsGroup(x));const oldByPhone=new Map(state.whatsappChats.map(c=>[String(c.phone||c.wa_chatid||'').replace(/@.*$/,''),c]));const needLoad=new Set();state.whatsappChats=incoming.map(x=>{const phone=String(x.phone||x.wa_chatid||'').replace(/@.*$/,'');const old=oldByPhone.get(phone)||{};const merged={...old,...x,id:String(old.id||x.id||x.wa_chatid||phone||uid()),phone,name:x.name||x.wa_contactName||x.wa_name||x.lead_name||old.name||phone||'Sem nome',wa_lastMessageText:x.wa_lastMessageText||old.wa_lastMessageText||'',agentStatus:old.agentStatus||'novo',agentLastProcessedId:old.agentLastProcessedId||'',agentSummary:old.agentSummary||'',agentUrgency:old.agentUrgency||'',agentPending:old.agentPending||[],agentLastRun:old.agentLastRun||''};const hasMsgs=state.whatsappMessages.some(m=>m.chatId===merged.id);if(!hasMsgs||String(x.wa_lastMsgTimestamp||'')!==String(old.wa_lastMsgTimestamp||''))needLoad.add(merged.id);return merged});if(!state.waSelectedChatId&&state.whatsappChats[0])state.waSelectedChatId=state.whatsappChats[0].id;if(state.waSelectedChatId)needLoad.add(state.waSelectedChatId);await sset('whatsappChats',state.whatsappChats);const toLoad=state.whatsappChats.filter(c=>needLoad.has(c.id)).slice(0,silent?20:40);for(const c of toLoad)await waLoadMessages(c,silent);await sset('whatsappChats',state.whatsappChats);render();if(!silent)toast(`${state.whatsappChats.length} conversa(s) sincronizada(s)`);if(w.agentEnabled!==false&&w.mode==='autonomo')await waRunAgent();return true}catch(e){if(silent)console.error('waSyncChats',e);else toast('Falha ao sincronizar conversas: '+e.message);return false}}
async function waSelect(id){const c=state.whatsappChats.find(x=>x.id===id);if(waIsGroup(c)){state.waSelectedChatId='';toast('Grupos do WhatsApp não são exibidos no NAVE.');render();return}state.waSelectedChatId=id;if(c)await waLoadMessages(c);render()}
async function waLoadMessages(c,silent=false){const w=waConfig();if(waIsGroup(c))return false;if(!w.token||!c)return false;const number=String(c.phone||c.wa_chatid||'').replace(/@.*$/,'');if(!number)return false;try{const r=await apiFetch((w.baseUrl||'https://api.zappfy.io')+'/message/find',{method:'POST',headers:{'Content-Type':'application/json',token:w.token},body:JSON.stringify({chatid:String(c.wa_chatid||number+'@s.whatsapp.net'),limit:100,offset:0})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||j.message||'HTTP '+r.status);const incoming=Array.isArray(j.messages)?j.messages:Array.isArray(j.data)?j.data:[];const keep=state.whatsappMessages.filter(m=>m.chatId!==c.id);const mapped=incoming.map(m=>({id:String(m.id||uid()),chatId:c.id,phone:number,direction:(m.fromMe||m.direction==='out'||m.messageType==='outgoing')?'out':'in',text:m.text||m.body||m.message||m.content||m.caption||'',at:m.timestamp?new Date(Number(m.timestamp)>1e12?Number(m.timestamp):Number(m.timestamp)*1000).toISOString():m.created||now(),provider:m})).filter(m=>m.text);state.whatsappMessages=keep.concat(mapped).slice(-5000);await sset('whatsappMessages',state.whatsappMessages);return true}catch(e){if(silent)console.error('waLoadMessages',e);else toast('Não foi possível carregar as mensagens: '+e.message);return false}}
async function waStatus(showSync=true){const w=waConfig();if(!w.token){openModal(`<h3>Configurar Zappfy</h3><p class="muted" style="font-size:12px">Informe o token da instância. Ele ficará armazenado somente no armazenamento do NAVE.</p><button class="btn primary" data-action="wa-setup">Configurar agora</button>`);return null}try{const r=await apiFetch((w.baseUrl||'https://api.zappfy.io')+'/instance/status',{headers:{token:w.token}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||j.error||'HTTP '+r.status);const inst=j?.instance||{};const st=j?.status||{};w.lastStatus=String(inst.status||'').toLowerCase()||((st.connected||st.loggedIn)?'connected':'disconnected');w.profileName=inst.profileName||w.profileName||'';w.phone=st?.jid?.user||w.phone||'';w.lastCheck=now();w.qrcode=inst.qrcode||'';w.paircode=inst.paircode||'';w.lastError='';await sset('config',state.config);render();if(showSync)waSyncResult(j);toast('Zappfy: '+waStatusLabel());return j}catch(e){w.lastStatus='error';w.lastError=e.message;w.qrcode='';await sset('config',state.config);render();toast('Falha ao consultar Zappfy: '+e.message);return null}}
async function waSync(){const j=await waStatus(false);if(!j)return;waSyncResult(j)}
function waSyncResult(j){const w=waConfig(),inst=j?.instance||{},st=j?.status||{},status=String(inst.status||'').toLowerCase();let box=document.getElementById('waSyncBox');if(!box)return;let html='';if(status==='connected'||st.connected||st.loggedIn){const num=st?.jid?.user||w.phone||'número conectado';html=`<div class="card" style="border-color:var(--ok);background:rgba(103,232,165,.05)"><div class="between"><div><div class="eyebrow">WhatsApp sincronizado</div><strong>${esc(inst.profileName||w.profileName||'WhatsApp conectado')}</strong><div class="wa-note">${esc(String(num))} · conectado à Zappfy</div></div><span class="badge" style="color:var(--ok);border-color:#315c46">CONECTADO</span></div></div>`}else if(inst.qrcode){html=`<div class="card" style="text-align:center"><div class="eyebrow">Conectar WhatsApp</div><strong>Escaneie este QR Code no celular</strong><div class="wa-note" style="margin:5px 0 10px">WhatsApp → Configurações → Aparelhos conectados → Conectar aparelho</div><img src="${esc(inst.qrcode)}" alt="QR Code para conectar WhatsApp" style="width:min(300px,80vw);height:auto;background:#fff;padding:10px;border-radius:12px"><div class="row" style="justify-content:center;margin-top:10px"><button class="btn small" data-action="wa-sync">Atualizar QR Code</button></div></div>`}else if(inst.paircode){html=`<div class="card"><div class="eyebrow">Código de pareamento</div><div style="font:700 24px 'DM Mono';margin:8px 0">${esc(inst.paircode)}</div><div class="wa-note">A Zappfy informou que a instância está em processo de conexão. Use o código de pareamento conforme o fluxo exibido no WhatsApp.</div><button class="btn small" style="margin-top:9px" data-action="wa-sync">Atualizar</button></div>`}else{html=`<div class="card"><div class="between"><div><div class="eyebrow">Sincronização</div><strong>Instância: ${esc(status||'desconhecida')}</strong><div class="wa-note" style="margin-top:4px">A Zappfy não retornou QR Code neste momento. Se a instância estiver desconectada, inicie a conexão no painel da Zappfy e clique novamente em Sincronizar WhatsApp.</div></div><button class="btn small" data-action="wa-sync">Atualizar</button></div></div>`}box.innerHTML=html}
function waSetup(){const w=waConfig();openModal(`<h3>Agente WhatsApp</h3><form id="waForm"><div class="field"><label>Token Zappfy</label><input name="token" type="password" autocomplete="off" value="${esc(w.token||'')}" placeholder="Cole o token da instância"></div><div class="field"><label>Instância</label><input name="instanceId" value="${esc(w.instanceId||'')}"></div><div class="field"><label>Número</label><input name="phone" value="${esc(w.phone||'')}" placeholder="5511999999999"></div><div class="field"><label>Modo do agente</label><select name="mode"><option value="copiloto" ${w.mode==='copiloto'?'selected':''}>Copiloto — prepara, advogado envia</option><option value="autonomo" ${w.mode==='autonomo'?'selected':''}>Autônomo — somente se o canal de entrada estiver ativo</option><option value="humano" ${w.mode==='humano'?'selected':''}>Humano — sem resposta automática</option></select></div><details class="more"><summary>Integração avançada</summary><div class="field"><label>Base URL</label><input name="baseUrl" value="${esc(w.baseUrl||'https://api.zappfy.io')}"></div><div class="field"><label>Rota de envio de texto</label><input name="sendPath" value="${esc(w.sendPath||'/send/text')}" placeholder="/send/text"></div><div class="field"><label>URL pública de webhook (opcional)</label><input name="webhookUrl" value="${esc(w.webhookUrl||'')}" placeholder="https://seu-backend/webhook/zappfy"></div></details><div class="wa-setup" style="padding:10px;border-radius:10px;margin-bottom:10px"><div class="wa-note">O HTML isolado não consegue hospedar um webhook público. Para agente realmente autônomo, use o webhook/SSE da Zappfy ou um pequeno backend/relay. O NAVE não vai fingir que uma URL local recebe eventos.</div></div><div class="row"><button class="btn primary">Salvar</button><button type="button" class="btn" data-close>Fechar</button></div></form></div>`);$('waForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);state.config.whatsapp={...w,token:String(f.get('token')||'').trim(),instanceId:String(f.get('instanceId')||'').trim(),phone:String(f.get('phone')||'').trim(),mode:String(f.get('mode')||'copiloto'),baseUrl:String(f.get('baseUrl')||'https://api.zappfy.io').replace(/\/$/,''),sendPath:String(f.get('sendPath')||'/send/text').trim()||'/send/text',webhookUrl:String(f.get('webhookUrl')||'').trim()};await sset('config',state.config);closeModal();render();toast('Zappfy configurada')}}
async function waMarkRead(id){const w=waConfig(),c=state.whatsappChats.find(x=>x.id===id);if(!w.token||!c)return;const ids=state.whatsappMessages.filter(m=>m.chatId===id&&m.direction==='in'&&(m.provider?.messageid||m.provider?.id||m.id)).slice(-50).map(m=>m.provider?.messageid||m.provider?.id||m.id);if(!ids.length){toast('Nenhuma mensagem recebida para marcar como lida');return}try{const r=await apiFetch((w.baseUrl||'https://api.zappfy.io')+'/message/markread',{method:'POST',headers:{'Content-Type':'application/json',token:w.token},body:JSON.stringify({id:ids})});if(!r.ok)throw new Error('HTTP '+r.status);c.wa_unreadCount=0;await sset('whatsappChats',state.whatsappChats);render();toast('Mensagens marcadas como lidas')}catch(e){toast('Não foi possível marcar como lida: '+e.message)}}
async function waInlineSend(id){const c=state.whatsappChats.find(x=>x.id===id),ta=$('waInlineText');const text=ta?.value?.trim();if(!c||!text)return;const ok=await waSend(c.phone||c.wa_chatid,text);if(ok){await waLoadMessages(c);render()}}
function waCompose(chatId){const c=state.whatsappChats.find(x=>x.id===chatId);openModal(`<h3>${c?'WhatsApp — '+esc(c.name||c.phone):'Enviar WhatsApp'}</h3><form id="waSendForm"><div class="field"><label>Número</label><input name="phone" required value="${esc(c?.phone||'')}" placeholder="5511999999999"></div><div class="field"><label>Mensagem</label><textarea name="text" required placeholder="Digite a mensagem..."></textarea></div><details class="more"><summary>Modo do agente</summary><div class="field"><select name="agentMode"><option value="manual">Manual</option><option value="copiloto">Copiloto — gerar resposta antes</option></select></div></details><div class="row"><button class="btn primary">Enviar</button><button type="button" class="btn" data-close>Cancelar</button></div></form>`);$('waSendForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),phone=String(f.get('phone')).replace(/\D/g,''),text=String(f.get('text')).trim();await waSend(phone,text);closeModal()}}
async function waSend(phone,text){const w=waConfig();if(!String(phone||'').replace(/\D/g,'')){toast('Número de destino inválido.');return false}const target=state.whatsappChats.find(c=>String(c.phone||'').replace(/\D/g,'')===String(phone||'').replace(/\D/g,''));if(waIsGroup(target)){toast('Envio bloqueado: o NAVE não envia mensagens para grupos do WhatsApp.');return false}if(String(phone||'').includes('@g.us')){toast('Envio bloqueado: grupos do WhatsApp estão desativados.');return false}if(!w.token){toast('Configure o token Zappfy primeiro');return false}if(!w.sendPath)w.sendPath='/send/text';try{const url=(w.baseUrl||'https://api.zappfy.io')+w.sendPath;const r=await apiFetch(url,{method:'POST',headers:{'Content-Type':'application/json',token:w.token},body:JSON.stringify({number:String(phone).replace(/\D/g,''),text,readchat:true,readmessages:true})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||'HTTP '+r.status);const chat=state.whatsappChats.find(c=>c.phone===phone)||{id:uid(),phone,name:phone};if(!state.whatsappChats.find(c=>c.id===chat.id))state.whatsappChats.push(chat);state.whatsappMessages.push({id:uid(),chatId:chat.id,direction:'out',phone,text,at:now(),provider:j});await Promise.all([sset('whatsappChats',state.whatsappChats),sset('whatsappMessages',state.whatsappMessages)]);render();toast('Mensagem enviada pela Zappfy');return true}catch(e){toast('Falha no envio: '+e.message);return false}}
function waAgentSystem(){return `Você é o agente de atendimento do escritório Vilmar Guimarães Júnior. Você atua no WhatsApp como atendimento do escritório, sem usar nome de pessoa. Não se apresente como Vilmar e não invente identidade humana. Se perguntarem diretamente, diga que é uma assistente virtual do escritório. Sua função é acolher, entender, fazer triagem, coletar somente dados mínimos e encaminhar para Vilmar. Não prometa resultado, não informe honorários, não dê parecer definitivo, não invente leis, jurisprudência, processos ou fatos. Não peça diagnóstico, laudo, medicação ou outros dados sensíveis detalhados pelo WhatsApp; peça apenas o mínimo necessário e sinalize transferência humana. Se houver risco à saúde, oriente procurar atendimento de emergência antes da questão jurídica. Nunca recuse de forma seca: organize o encaminhamento. Uma pergunta por vez. Português do Brasil. O foco do escritório inclui saúde de crianças e adolescentes, mas outras demandas devem ser acolhidas e classificadas. Quando a triagem estiver suficiente, produza um resumo para Vilmar, pendências e tarefas. Responda SEMPRE em JSON válido, sem markdown, com: reply (texto a enviar), intent, urgency (baixa|normal|alta|critica), status (em_triagem|aguardando_cliente|aguardando_vilmar|pendencia|encaminhar_humano|encerrado), summary, missing (array de strings), pending (array de strings), tasks (array de objetos {title,priority,dueDate}), createLead (boolean), leadSubject, leadNotes, transferToVilmar (boolean), appointmentNeeded (boolean), appointmentNote. A resposta ao cliente deve ser curta, humana e sem revelar raciocínio interno. Se faltar informação, pergunte apenas a próxima coisa mais importante.`}
function waThreadText(id){return state.whatsappMessages.filter(m=>m.chatId===id).slice(-20).map(m=>(m.direction==='in'?'Cliente: ':'Escritório: ')+m.text).join('\n')}
function extractJSON(txt){const clean=String(txt||'').replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();try{return JSON.parse(clean)}catch(e){const a=clean.indexOf('{'),b=clean.lastIndexOf('}');if(a>=0&&b>a)return JSON.parse(clean.slice(a,b+1));throw e}}
function aiConfigured(){return !!String(state.config.anthropicApiKey||'').trim()}
async function aiMessages(system,messages,maxTokens=1024){const key=String(state.config.anthropicApiKey||'').trim();if(!key)throw new Error('Configure a chave da API Anthropic em Configurações (⚙) para usar a IA.');const body={model:String(state.config.aiModel||'claude-sonnet-4-6').trim()||'claude-sonnet-4-6',max_tokens:maxTokens,system,messages};const r=await apiFetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j?.error?.message||('IA indisponível ('+r.status+')'));return (j.content||[]).map(x=>x.text||'').join('\n').trim()}
async function waAskAgent(c){const thread=waThreadText(c.id);const prompt=`Analise a conversa abaixo e decida a próxima ação. Não invente informações. Se a pessoa ainda não explicou o problema, faça uma pergunta objetiva. Se a triagem estiver suficiente, transfira para Vilmar e liste as pendências/tarefas. Se já for cliente, preserve o sigilo e encaminhe ao advogado.\n\nCONTATO: ${c.name||''} / ${c.phone||''}\n\nCONVERSA:\n${thread}`;const text=await aiMessages(waAgentSystem(),[{role:'user',content:prompt}],1000);return extractJSON(text)}
async function waCreateAgentTasks(c,decision){if(waConfig().createTasks===false)return;const existingTitles=new Set(state.tasks.filter(t=>!t.done&&t.sourceChatId===c.id).map(t=>t.title));for(const t of (decision.tasks||[])){const title=String(t.title||'').trim();if(!title||existingTitles.has(title))continue;state.tasks.push({id:uid(),title,priority:t.priority||decision.urgency||'normal',due:t.dueDate||today(),dueDate:t.dueDate||today(),done:false,source:'WhatsApp',sourceChatId:c.id,client:c.name||c.phone,notes:decision.summary||'',createdAt:now()});}if((decision.pending||[]).length&&!existingTitles.has('Revisar pendências do WhatsApp'))state.tasks.push({id:uid(),title:'Revisar pendências do WhatsApp',priority:decision.urgency||'normal',due:today(),dueDate:today(),done:false,source:'WhatsApp',sourceChatId:c.id,client:c.name||c.phone,notes:(decision.pending||[]).join('; '),createdAt:now()});await sset('tasks',state.tasks)}
async function waUpsertLead(c,decision){if(!decision.createLead||waConfig().createLead===false)return;const phone=String(c.phone||'').replace(/\D/g,'');let lead=state.leads.find(l=>String(l.phone||'').replace(/\D/g,'')===phone);if(!lead){lead={id:uid(),name:c.name||phone,phone,subject:decision.leadSubject||decision.intent||'Atendimento WhatsApp',urgency:decision.urgency||'normal',source:'WhatsApp',estimatedValue:0,notes:decision.leadNotes||decision.summary||'',contactAt:today(),createdAt:now(),stage:'LEAD',nextTouch:addDays(today(),1)};state.leads.push(lead)}else{lead.notes=(lead.notes?lead.notes+'\n':'')+(decision.summary||'');lead.urgency=decision.urgency||lead.urgency}await sset('leads',state.leads)}
async function waRunAgent(){const w=waConfig();if(w.agentEnabled===false||w.mode!=='autonomo'||w.autoReply===false)return;if(!aiConfigured())return 0;const inboundChats=waIndividualChats().filter(c=>state.whatsappMessages.some(m=>m.chatId===c.id&&m.direction==='in'));let processed=0;for(const c of inboundChats.slice(0,40)){try{if(waIsGroup(c))continue;const incoming=state.whatsappMessages.filter(m=>m.chatId===c.id&&m.direction==='in');const last=incoming[incoming.length-1];if(!last||c.agentLastProcessedId===last.id)continue;const latestOut=state.whatsappMessages.filter(m=>m.chatId===c.id&&m.direction==='out').slice(-1)[0];if(latestOut&&new Date(latestOut.at)>new Date(last.at)){c.agentStatus='aguardando_cliente';c.agentLastRun=now();continue;}const decision=await waAskAgent(c);c.agentSummary=decision.summary||'';c.agentUrgency=decision.urgency||'normal';c.agentPending=Array.isArray(decision.pending)?decision.pending:[];c.agentStatus=decision.status||'aguardando_vilmar';c.agentLastRun=now();await waUpsertLead(c,decision);await waCreateAgentTasks(c,decision);if(decision.transferToVilmar||decision.status==='aguardando_vilmar'||decision.status==='pendencia'||decision.status==='encaminhar_humano')c.agentStatus='aguardando_vilmar';if(decision.reply&&decision.status!=='encerrado'){await waSend(c.phone,decision.reply);}
c.agentLastProcessedId=last.id;state.waAgentLogs.push({id:uid(),chatId:c.id,at:now(),decision});if(state.waAgentLogs.length>300)state.waAgentLogs=state.waAgentLogs.slice(-300);processed++;await sset('whatsappChats',state.whatsappChats);await sset('waAgentLogs',state.waAgentLogs)}catch(e){c.agentStatus='erro_ia';c.agentLastError=e.message;state.waAgentLogs.push({id:uid(),chatId:c.id,at:now(),error:e.message});await sset('waAgentLogs',state.waAgentLogs)}}if(processed){await sset('whatsappChats',state.whatsappChats);render();toast(`Agente processou ${processed} conversa(s)`)}return processed}
function startWaAgentLoop(){if(window.__naveWaLoop)clearInterval(window.__naveWaLoop);const w=waConfig();if(w.agentEnabled!==false&&w.mode==='autonomo'&&w.polling!==false){window.__naveWaLoop=setInterval(async()=>{try{await waSyncChats(true)}catch(e){console.error(e)}},Math.max(15000,Number(w.pollMs||30000)));}}
function waOpen(id){state.waSelectedChatId=id;renderCommercial()}
async function waAgent(id){const c=state.whatsappChats.find(x=>x.id===id);if(!c)return;const msgs=state.whatsappMessages.filter(m=>m.chatId===id).slice(-12).map(m=>(m.direction==='in'?'Cliente: ':'Advogado: ')+m.text).join('\n');const prompt=`Faça o pré-atendimento desta conversa de WhatsApp. Identifique intenção, urgência, dados faltantes e produza uma resposta pronta para o cliente. Não prometa resultado, não invente fatos e não dê diagnóstico jurídico definitivo sem os dados necessários.\n\n${msgs}`;closeModal();nav('assistant');$('chatInput').value=prompt;$('chatInput').focus();toast('Conversa enviada ao Assistente IA')}
function leadCard(l){return `<article class="lead-card"><div class="between"><h4>${esc(l.name)}</h4><span class="badge ${l.urgency==='alta'?'hot':''}">${esc(l.urgency||'normal')}</span></div><p>${esc(l.phone)} · ${esc(l.source||'origem não informada')}</p><p>${esc(l.subject||'sem assunto')} · ${money(l.estimatedValue||0)}</p><p>Entrada ${dateBR(l.createdAt?.slice(0,10))} · Próximo ${dateBR(l.nextTouch)}</p><div class="row" style="margin-top:8px"><button class="btn small" data-action="lead-detail" data-id="${l.id}">Abrir</button><button class="btn small" data-action="followup" data-id="${l.id}">Follow-up</button></div></article>`}
function renderLegal(){const el=$('view-legal');el.innerHTML=`<div class="section-head"><div><div class="eyebrow">Processos, prazos e clientes</div><h2>Jurídico</h2></div><div class="row"><button class="btn" data-action="new-client">+ Cliente</button><button class="btn primary" data-action="new-process">+ Processo</button></div></div><div class="grid grid2"><div class="card"><div class="between"><strong>Processos</strong><span class="badge">${state.processes.length}</span></div><div class="list" style="margin-top:10px">${state.processes.map(p=>`<div class="item"><div class="between"><strong>${esc(p.number)}</strong><span class="badge">${esc(p.phase)}</span></div><div class="muted" style="font-size:11px">${esc(p.clientName)} · ${esc(p.court||'tribunal não informado')}</div><div class="pillbar" style="margin-top:8px"><i style="width:${['Pré-judicial','Inicial','Instrução','Sentença','Recurso','Encerrado'].indexOf(p.phase)>=0?(['Pré-judicial','Inicial','Instrução','Sentença','Recurso','Encerrado'].indexOf(p.phase)+1)/6*100:0}%"></i></div><div class="row" style="margin-top:8px"><button class="btn small" data-action="process-detail" data-id="${p.id}">Abrir</button><button class="btn small" data-action="client-summary" data-id="${p.id}">Resumo cliente</button></div></div>`).join('')||'<div class="empty"><strong>Nenhum processo</strong>Crie o primeiro processo.</div>'}</div></div><div class="card"><div class="between"><strong>Prazos e audiências</strong><button class="btn small primary" data-action="new-deadline">+ Prazo</button></div><div class="list" style="margin-top:10px">${state.deadlines.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8).map(d=>`<div class="item ${daysDiff(d.date)<=5&&daysDiff(d.date)>=0?'fatal':''}"><div class="between"><strong>${esc(d.title)}</strong><span class="mono">${dateBR(d.date)}</span></div><div class="muted" style="font-size:11px">${esc(d.type)} · ${esc(d.processNumber||'sem processo')}</div><button class="btn small" style="margin-top:7px" data-action="ics" data-id="${d.id}">Copiar p/ agenda</button></div>`).join('')||'<div class="empty"><strong>Nenhum prazo</strong>Cadastre um prazo ou audiência.</div>'}</div></div></div><div class="card" style="margin-top:12px"><div class="between"><strong>Publicação → análise humana</strong><button class="btn small" data-action="publication">Analisar texto</button></div><textarea id="pubText" placeholder="Cole aqui o texto da publicação..."></textarea><div class="muted" style="font-size:10px;margin-top:6px">A IA apenas sugere. O prazo só entra no sistema após confirmação.</div></div><div class="card" style="margin-top:12px"><div class="between"><strong>Clientes</strong><span class="badge">${state.clients.length}</span></div><div class="list" style="margin-top:10px">${state.clients.map(c=>`<div class="item"><div class="between"><strong>${esc(c.name)}</strong><span class="mono">${esc(c.phone)}</span></div><div class="muted" style="font-size:11px">${state.processes.filter(p=>p.clientId===c.id).length} processo(s)</div></div>`).join('')||'<div class="empty"><strong>Nenhum cliente</strong>Clientes são criados ao fechar uma oportunidade.</div>'}</div></div>`}
function renderFinance(){const el=$('view-finance');const month=today().slice(0,7);const all=state.contracts.flatMap(c=>(c.installments||[]).map(i=>({...i,client:c.client,contractId:c.id,area:c.area||'não informada'})));const received=all.filter(i=>i.status==='paid'&&i.paidAt?.slice(0,7)===month).reduce((a,i)=>a+Number(i.value||0),0);const receivable=all.filter(i=>i.status!=='paid'&&i.dueDate?.slice(0,7)===month).reduce((a,i)=>a+Number(i.value||0),0);const overdue=all.filter(i=>i.status!=='paid'&&daysDiff(i.dueDate)<0).reduce((a,i)=>a+Number(i.value||0),0);el.innerHTML=`<div class="section-head"><div><div class="eyebrow">Honorários e cobrança</div><h2>Financeiro</h2></div><button class="btn primary" data-action="new-contract">+ Contrato</button></div><div class="grid grid3"><div class="card metric"><div class="label">Recebido no mês</div><div class="num">${money(received)}</div></div><div class="card metric"><div class="label">A receber no mês</div><div class="num">${money(receivable)}</div></div><div class="card metric"><div class="label">Inadimplência</div><div class="num bad">${money(overdue)}</div></div></div><div class="card" style="margin-top:12px"><div class="between"><strong>Contratos</strong><span class="badge">${state.contracts.length}</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Cliente</th><th>Total</th><th>Parcelas</th><th>Êxito</th><th>Ação</th></tr></thead><tbody>${state.contracts.map(c=>`<tr><td>${esc(c.client)}</td><td>${money(c.total)}</td><td>${(c.installments||[]).length}</td><td>${Number(c.success||0)}%</td><td><button class="btn small" data-action="contract-detail" data-id="${c.id}">Ver</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">Nenhum contrato.</td></tr>'}</tbody></table></div></div><div class="card" style="margin-top:12px"><div class="between"><strong>Indicadores do mês</strong><span class="badge">${month}</span></div><div class="grid grid3" style="margin-top:10px"><div><div class="muted" style="font-size:10px">Ticket médio recebido</div><strong>${money(state.contracts.filter(c=>(c.installments||[]).some(i=>i.status==='paid'&&i.paidAt?.slice(0,7)===month)).length?received/Math.max(1,state.contracts.filter(c=>(c.installments||[]).some(i=>i.status==='paid'&&i.paidAt?.slice(0,7)===month)).length):0)}</strong></div><div><div class="muted" style="font-size:10px">Contratos recebidos</div><strong>${state.contracts.filter(c=>(c.installments||[]).some(i=>i.status==='paid'&&i.paidAt?.slice(0,7)===month)).length}</strong></div><div><div class="muted" style="font-size:10px">Áreas</div><strong>${new Set(state.contracts.map(c=>c.area).filter(Boolean)).size}</strong></div></div><div class="list" style="margin-top:10px">${Object.entries(state.contracts.reduce((m,c)=>{const v=(c.installments||[]).filter(i=>i.status==='paid'&&i.paidAt?.slice(0,7)===month).reduce((a,i)=>a+Number(i.value||0),0);m[c.area||'Não informada']=(m[c.area||'Não informada']||0)+v;return m},{})).map(([area,v])=>`<div class="statline"><span>${esc(area)}</span><strong>${money(v)}</strong></div>`).join('')||'<span class="muted">Sem recebimentos por área neste mês.</span>'}</div></div><div class="card" style="margin-top:12px"><div class="between"><strong>Parcelas</strong><span class="badge">${all.length}</span></div><div class="list" style="margin-top:10px">${all.sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,15).map(i=>{const overdue=i.status!=='paid'&&daysDiff(i.dueDate)<0;return `<div class="item ${overdue?'fatal':''}"><div class="between"><strong>${esc(i.client)} · ${money(i.value)}</strong><span>${dateBR(i.dueDate)}</span></div><div class="muted" style="font-size:11px">${i.status==='paid'?'Paga':overdue?'Atrasada':'Pendente'}</div><div class="row" style="margin-top:7px">${i.status!=='paid'?`<button class="btn small" data-action="charge" data-id="${i.contractId}" data-installment="${i.id}">Cobrar</button><button class="btn small primary" data-action="pay" data-id="${i.contractId}" data-installment="${i.id}">Registrar pagamento</button>`:'<span class="good" style="font-size:10px">Pagamento registrado</span>'}</div></div>`}).join('')||'<div class="empty"><strong>Nenhuma parcela</strong>Crie um contrato para gerar parcelas.</div>'}</div></div>`}
function renderAssistant(){const el=$('view-assistant');el.innerHTML=`<div class="section-head"><div><div class="eyebrow">IA com contexto real</div><h2>Assistente</h2></div></div><div class="card chat"><div class="chips"><button class="chip" data-chip="pre">Pré-atendimento</button><button class="chip" data-chip="follow">Follow-up</button><button class="chip" data-chip="charge">Cobrança</button><button class="chip" data-chip="hearing">Confirmação de audiência</button><button class="chip" data-chip="pub">Publicação</button><button class="chip" data-chip="month">Diagnóstico do mês</button></div><div class="messages" id="messages">${state.chat.length?state.chat.slice(-20).map(m=>`<div class="bubble ${m.role==='user'?'user':'ai'}">${esc(m.content)}</div>`).join(''):'<div class="empty"><strong>Assistente pronto</strong>Escolha uma função ou descreva o que precisa. O contexto do escritório será enviado à IA somente ao executar.</div>'}</div><div class="composer"><textarea id="chatInput" placeholder="Escreva ou cole o conteúdo..."></textarea><button class="btn primary" id="sendAI">Enviar</button></div></div>`;$('sendAI').onclick=()=>sendAI('');document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>chip(b.dataset.chip))}
function chip(type){const templates={pre:'Cole a mensagem do lead e faça pré-atendimento com triagem + resposta pronta.',follow:'Gere um follow-up para uma oportunidade parada. Informe nome, estágio e dias sem contato.',charge:'Gere uma cobrança para uma parcela. Informe cliente, valor, vencimento e dias de atraso/antecedência.',hearing:'Gere uma confirmação de audiência. Informe cliente, data, horário e processo.',pub:'Cole a publicação e resuma, apontando eventual prazo a cadastrar. Não cadastre automaticamente.',month:'Faça um diagnóstico do mês usando os números reais do escritório.'};$('chatInput').value=templates[type]||'';$('chatInput').focus()}
function aiContext(){return {pipeline:state.leads.map(l=>({name:l.name,stage:l.stage,subject:l.subject,value:l.estimatedValue,nextTouch:l.nextTouch})),contracts:state.contracts.map(c=>({client:c.client,total:c.total,installments:(c.installments||[]).map(i=>({value:i.value,dueDate:i.dueDate,status:i.status}))})),deadlines:state.deadlines.map(d=>({title:d.title,date:d.date,type:d.type,processNumber:d.processNumber})),losses:state.leads.filter(l=>l.stage==='PERDIDO').map(l=>({name:l.name,reason:l.lossReason})),learnings:state.learnings.slice(-20)}}
async function sendAI(prefix){const input=$('chatInput');const text=(prefix||input.value||'').trim();if(!text)return;state.chat.push({id:uid(),role:'user',content:text,at:now()});await persist('chat');renderAssistant();const ctx=JSON.stringify(aiContext());const system=`Você é o Assistente NAVE CRM de um escritório de advocacia brasileiro. Responda em português do Brasil, em até aproximadamente 180 palavras. Use apenas os dados fornecidos. Nunca invente jurisprudência, processos, estatísticas ou fatos. Para textos ao cliente, entregue texto pronto para copiar. Observe o Provimento 205/2021 e não prometa resultado. Se houver dado ausente, diga que falta a informação. Contexto real: ${ctx}`;try{const answer=(await aiMessages(system,[{role:'user',content:text}],1000))||'Não foi possível obter resposta.';state.chat.push({id:uid(),role:'assistant',content:answer,at:now()});await persist('chat');renderAssistant()}catch(e){state.chat.push({id:uid(),role:'assistant',content:'Não foi possível consultar a IA agora: '+(e?.message||'erro desconhecido')+' A operação não foi perdida.',at:now()});await persist('chat');renderAssistant()}}
function leadModal(existing){const l=existing||{};openModal(`<h3>${existing?'Editar lead':'Novo lead'}</h3><form id="leadForm"><div class="field"><label>Nome</label><input name="name" required value="${esc(l.name)}"></div><div class="field"><label>WhatsApp/telefone</label><input name="phone" required value="${esc(l.phone)}"></div><div class="field"><label>Assunto / área</label><input name="subject" value="${esc(l.subject)}"></div><div class="field"><label>Urgência</label><select name="urgency"><option ${l.urgency==='normal'?'selected':''}>normal</option><option ${l.urgency==='alta'?'selected':''}>alta</option><option ${l.urgency==='baixa'?'selected':''}>baixa</option></select></div><details class="more"><summary>Mais detalhes da triagem</summary><div class="field"><label>Origem</label><input name="source" value="${esc(l.source)}"></div><div class="field"><label>Valor estimado (R$)</label><input name="estimatedValue" type="number" step="100" value="${Number(l.estimatedValue)||0}"></div><div class="field"><label>Como chegou / contexto</label><textarea name="notes">${esc(l.notes)}</textarea></div><div class="field"><label>Contato inicial em</label><input name="contactAt" type="date" value="${esc(l.contactAt?.slice(0,10)||today())}"></div></details><div class="row"><button class="btn primary">Salvar</button><button type="button" class="btn" data-close>Cancelar</button></div></form>`);$('leadForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const data={...l,id:l.id||uid(),name:f.get('name').trim(),phone:f.get('phone').trim(),subject:f.get('subject').trim(),urgency:f.get('urgency'),source:f.get('source')||'manual',estimatedValue:Number(f.get('estimatedValue')||0),notes:f.get('notes')||'',contactAt:f.get('contactAt')||today(),createdAt:l.createdAt||now(),stage:l.stage||'LEAD',nextTouch:addDays(today(),1)};if(l.id){state.leads=state.leads.map(x=>x.id===l.id?data:x)}else state.leads.push(data);await persist('leads');closeModal();toast('Lead salvo')}}
function addDays(d,n){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function leadDetail(id){const l=state.leads.find(x=>x.id===id);if(!l)return;openModal(`<h3>${esc(l.name)}</h3><div class="item"><div class="statline"><span>Estágio</span><strong>${esc(l.stage)}</strong></div><div class="statline"><span>Telefone</span><span>${esc(l.phone)}</span></div><div class="statline"><span>Assunto</span><span>${esc(l.subject)}</span></div><div class="statline"><span>Valor estimado</span><strong>${money(l.estimatedValue)}</strong></div></div><div class="row" style="margin-top:10px">${['LEAD','QUALIFICAÇÃO','PROPOSTA'].includes(l.stage)?`<button class="btn" data-move="${l.stage==='LEAD'?'QUALIFICAÇÃO':'PROPOSTA'}" data-id="${l.id}">Avançar</button>`:''}${l.stage==='PROPOSTA'?`<button class="btn primary" data-closelead="${l.id}">Fechar oportunidade</button><button class="btn danger" data-lost="${l.id}">Marcar perdida</button>`:''}<button class="btn" data-edit="${l.id}">Editar</button><button class="btn" data-follow="${l.id}">Gerar follow-up</button></div>`);}
async function moveLead(id,stage){const l=state.leads.find(x=>x.id===id);if(!l)return;l.stage=stage;if(stage==='PROPOSTA')l.proposalAt=now();l.nextTouch=addDays(today(),stage==='PROPOSTA'?1:3);await persist('leads');closeModal();toast('Lead movido')}
function closeLead(id){const l=state.leads.find(x=>x.id===id);if(!l)return;openModal(`<h3>Fechar oportunidade</h3><form id="closeForm"><div class="field"><label>Valor contratado</label><input name="total" type="number" step="100" required value="${Number(l.estimatedValue)||0}"></div><div class="field"><label>Parcelas</label><input name="parts" type="number" min="1" max="60" value="1"></div><div class="field"><label>Entrada</label><input name="entry" type="number" step="100" value="0"></div><div class="field"><label>% de êxito</label><input name="success" type="number" min="0" max="100" value="0"></div><details class="more"><summary>Mais detalhes</summary><div class="field"><label>Área</label><input name="area" value="${esc(l.subject)}"></div><div class="field"><label>Primeiro vencimento</label><input name="firstDue" type="date" value="${addDays(today(),30)}"></div></details><div class="row"><button class="btn primary">Criar cliente, contrato e processo</button><button type="button" class="btn" data-close>Cancelar</button></div></form>`);$('closeForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),total=Number(f.get('total')||0),parts=Math.max(1,Number(f.get('parts')||1)),entry=Math.max(0,Number(f.get('entry')||0)),rest=Math.max(0,total-entry),base=parts?rest/parts:rest;const client={id:uid(),name:l.name,phone:l.phone,sourceLeadId:l.id,createdAt:now()};state.clients.push(client);const contract={id:uid(),clientId:client.id,client:client.name,total,entry,success:Number(f.get('success')||0),area:f.get('area')||l.subject,createdAt:now(),installments:[]};for(let i=0;i<parts;i++){contract.installments.push({id:uid(),value:i===parts-1?+(rest-base*(parts-1)).toFixed(2):+base.toFixed(2),dueDate:addDays(f.get('firstDue'),i*30),status:'pending'})}state.contracts.push(contract);const process={id:uid(),clientId:client.id,clientName:client.name,number:'A definir',court:'A definir',phase:'Pré-judicial',responsible:state.config.lawyer||'',createdAt:now(),folder:'NAVE-'+client.id};state.processes.push(process);l.stage='FECHADO';l.closedAt=now();l.clientId=client.id;l.contractId=contract.id;await Promise.all(['clients','contracts','processes','leads'].map(p=>sset(p,state[p])));closeModal();render();toast('Fechado: cliente, contrato, parcelas e pasta jurídica criados')}}
function lostLead(id){const l=state.leads.find(x=>x.id===id);openModal(`<h3>Motivo da perda</h3><form id="lostForm"><div class="field"><label>Motivo obrigatório</label><select name="reason" required><option value="">Selecione</option><option>preço</option><option>demora</option><option>concorrente</option><option>sem perfil</option></select></div><div class="field"><label>Aprendizado (1 linha)</label><input name="learning" placeholder="O que devemos repetir ou evitar?"></div><div class="row"><button class="btn danger">Salvar perda</button><button type="button" class="btn" data-close>Cancelar</button></div></form>`);$('lostForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);l.stage='PERDIDO';l.lossReason=f.get('reason');l.lossAt=now();if(f.get('learning'))state.learnings.push({id:uid(),text:f.get('learning'),source:'perda',createdAt:now()});await Promise.all([sset('leads',state.leads),sset('learnings',state.learnings)]);closeModal();render();toast('Perda registrada')}}
function followup(id){const l=state.leads.find(x=>x.id===id);if(!l)return;const touch=Math.max(1,daysDiff(today(),l.nextTouch||today()));const text=`Olá, ${l.name}. Passando para saber se conseguiu avaliar nossa conversa sobre ${l.subject||'o seu caso'}. Se ainda fizer sentido para você, posso dar continuidade ao atendimento e esclarecer os próximos pontos.`;openModal(`<h3>Follow-up — ${esc(l.name)}</h3><div class="field"><label>Mensagem pronta</label><textarea id="copyText">${esc(text)}</textarea></div><div class="row"><button class="btn primary" data-copy="#copyText">Copiar</button><button class="btn" data-close>Fechar</button></div>`)}
function charge(contractId,instId){const c=state.contracts.find(x=>x.id===contractId),i=c?.installments.find(x=>x.id===instId);if(!c||!i)return;const delta=daysDiff(i.dueDate);const tone=delta>0?'D-'+delta:delta===0?'vencimento hoje':'D+'+Math.abs(delta);const text=delta>0?`Olá, ${c.client}. Passando para lembrar que a parcela de ${money(i.value)} vence em ${dateBR(i.dueDate)}. Se precisar de alguma informação para realizar o pagamento, fico à disposição.`:delta===0?`Olá, ${c.client}. A parcela de ${money(i.value)} vence hoje (${dateBR(i.dueDate)}). Segue a referência para pagamento.${state.config.pix?' PIX: '+state.config.pix:''}`:`Olá, ${c.client}. Identificamos que a parcela de ${money(i.value)}, com vencimento em ${dateBR(i.dueDate)}, ainda consta como pendente. Se o pagamento já foi realizado, desconsidere esta mensagem. Caso contrário, podemos alinhar a regularização.${state.config.pix?' PIX: '+state.config.pix:''}`;openModal(`<h3>Cobrança ${tone}</h3><div class="field"><label>Mensagem pronta</label><textarea id="copyText">${esc(text)}</textarea></div><div class="row"><button class="btn primary" data-copy="#copyText">Copiar</button><button class="btn" data-close>Fechar</button></div>`)}
async function pay(cid,iid){const c=state.contracts.find(x=>x.id===cid),i=c?.installments.find(x=>x.id===iid);if(!i)return;openModal(`<h3>Registrar pagamento</h3><p class="muted">Confirme o recebimento de ${money(i.value)} de ${esc(c.client)}.</p><div class="row"><button class="btn primary" id="payYes">Confirmar pagamento</button><button class="btn" data-close>Cancelar</button></div>`);$('payYes').onclick=async()=>{i.status='paid';i.paidAt=now();await persist('contracts');closeModal();toast('Pagamento registrado')}}
function contractDetail(id){const c=state.contracts.find(x=>x.id===id);if(!c)return;openModal(`<h3>${esc(c.client)}</h3><div class="item"><div class="statline"><span>Total</span><strong>${money(c.total)}</strong></div><div class="statline"><span>Entrada</span><span>${money(c.entry)}</span></div><div class="statline"><span>Êxito</span><span>${Number(c.success)}%</span></div><div class="statline"><span>Área</span><span>${esc(c.area)}</span></div></div><div class="list" style="margin-top:10px">${c.installments.map(i=>`<div class="item"><div class="between"><strong>${money(i.value)}</strong><span>${dateBR(i.dueDate)}</span></div><div class="muted">${i.status==='paid'?'Paga':daysDiff(i.dueDate)<0?'Atrasada':'Pendente'}</div></div>`).join('')}</div><button class="btn" style="margin-top:10px" data-close>Fechar</button>`)}
function clientSummary(pid){const p=state.processes.find(x=>x.id===pid);if(!p)return;const ds=state.deadlines.filter(d=>d.processId===pid).sort((a,b)=>a.date.localeCompare(b.date));const text=`Olá, ${p.clientName}. Atualização do seu processo: ${p.number==='A definir'?'o processo ainda está em fase de organização inicial':`o processo ${p.number} está na fase de ${p.phase}`}. ${ds[0]?`O próximo compromisso registrado é ${ds[0].title}, em ${dateBR(ds[0].date)}.`:'No momento, não há prazo ou audiência próximo cadastrado.'} Se houver qualquer mudança relevante, atualizaremos você por aqui.`;openModal(`<h3>Resumo para o cliente</h3><div class="field"><textarea id="copyText">${esc(text)}</textarea></div><div class="row"><button class="btn primary" data-copy="#copyText">Copiar</button><button class="btn" data-close>Fechar</button></div>`)}
function processModal(){openModal(`<h3>Novo processo</h3><form id="processForm"><div class="field"><label>Cliente</label><select name="clientId" required>${state.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Número</label><input name="number" required placeholder="Número CNJ"></div><div class="field"><label>Vara / tribunal</label><input name="court"></div><div class="field"><label>Fase</label><select name="phase"><option>Pré-judicial</option><option>Inicial</option><option>Instrução</option><option>Sentença</option><option>Recurso</option><option>Encerrado</option></select></div><details class="more"><summary>Mais detalhes</summary><div class="field"><label>Responsável</label><input name="responsible" value="${esc(state.config.lawyer)}"></div></details><div class="row"><button class="btn primary">Salvar</button><button type="button" class="btn" data-close>Cancelar</button></div></form>`);$('processForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),c=state.clients.find(x=>x.id===f.get('clientId'));state.processes.push({id:uid(),clientId:c.id,clientName:c.name,number:f.get('number'),court:f.get('court'),phase:f.get('phase'),responsible:f.get('responsible'),createdAt:now(),folder:'NAVE-'+c.id});await persist('processes');closeModal();toast('Processo criado')}}
function clientModal(){openModal(`<h3>Novo cliente</h3><form id="clientForm"><div class="field"><label>Nome</label><input name="name" required></div><div class="field"><label>Telefone</label><input name="phone"></div><div class="field"><label>Observação</label><input name="notes"></div><div class="field"><label>Origem</label><input name="source" value="manual"></div><div class="row"><button class="btn primary">Salvar</button><button type="button" class="btn" data-close>Cancelar</button></div></form>`);$('clientForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);state.clients.push({id:uid(),name:f.get('name'),phone:f.get('phone'),notes:f.get('notes'),source:f.get('source'),createdAt:now()});await persist('clients');closeModal();toast('Cliente salvo')}}
function deadlineModal(){openModal(`<h3>Novo prazo / audiência</h3><form id="deadlineForm"><div class="field"><label>Título</label><input name="title" required placeholder="Ex.: audiência de instrução"></div><div class="field"><label>Data</label><input name="date" type="date" required value="${addDays(today(),1)}"></div><div class="field"><label>Tipo</label><select name="type"><option value="fatal">fatal</option><option value="common">comum</option><option value="hearing">audiência</option></select></div><div class="field"><label>Processo</label><select name="processId"><option value="">Sem processo</option>${state.processes.map(p=>`<option value="${p.id}">${esc(p.number)} — ${esc(p.clientName)}</option>`).join('')}</select></div><div class="row"><button class="btn primary">Salvar</button><button type="button" class="btn" data-close>Cancelar</button></div></form>`);$('deadlineForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),p=state.processes.find(x=>x.id===f.get('processId'));state.deadlines.push({id:uid(),title:f.get('title'),date:f.get('date'),type:f.get('type'),processId:f.get('processId'),processNumber:p?.number||'',createdAt:now()});await persist('deadlines');closeModal();toast('Prazo salvo')}}
function contractModal(){const clients=state.clients;if(!clients.length){toast('Crie um cliente primeiro');return}openModal(`<h3>Novo contrato</h3><form id="contractForm"><div class="field"><label>Cliente</label><select name="clientId" required>${clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Valor total</label><input name="total" type="number" step="100" required></div><div class="field"><label>Número de parcelas</label><input name="parts" type="number" min="1" max="60" value="1"></div><div class="field"><label>Primeiro vencimento</label><input name="firstDue" type="date" value="${addDays(today(),30)}"></div><details class="more"><summary>Mais detalhes</summary><div class="field"><label>Entrada</label><input name="entry" type="number" step="100" value="0"></div><div class="field"><label>% de êxito</label><input name="success" type="number" min="0" max="100" value="0"></div><div class="field"><label>Área</label><input name="area"></div></details><div class="row"><button class="btn primary">Criar contrato</button><button type="button" class="btn" data-close>Cancelar</button></div></form>`);$('contractForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),c=clients.find(x=>x.id===f.get('clientId')),total=Number(f.get('total')||0),parts=Math.max(1,Number(f.get('parts')||1)),entry=Number(f.get('entry')||0),rest=Math.max(0,total-entry),base=rest/parts,contract={id:uid(),clientId:c.id,client:c.name,total,entry,success:Number(f.get('success')||0),area:f.get('area')||'',createdAt:now(),installments:[]};for(let i=0;i<parts;i++)contract.installments.push({id:uid(),value:+(i===parts-1?rest-base*(parts-1):base).toFixed(2),dueDate:addDays(f.get('firstDue'),i*30),status:'pending'});state.contracts.push(contract);await persist('contracts');closeModal();toast('Contrato criado')}}
function publication(){const t=$('pubText')?.value.trim();if(!t){toast('Cole o texto da publicação');return}sendAI('Analise esta publicação. Resuma em linguagem objetiva, identifique eventual prazo e sugira os campos para cadastro. Não cadastre automaticamente e deixe claro que a confirmação humana é necessária.\n\n'+t)}
function copyText(sel){const el=document.querySelector(sel);if(!el)return;navigator.clipboard?.writeText(el.value||el.textContent||'').then(()=>toast('Copiado')).catch(()=>{el.select();document.execCommand('copy');toast('Copiado')})}
function ics(id){const d=state.deadlines.find(x=>x.id===id);if(!d)return;const text=`${d.title} — ${dateBR(d.date)} — ${d.type}${d.processNumber?' — '+d.processNumber:''}`;openModal(`<h3>Texto para sua agenda</h3><div class="field"><textarea id="copyText">${esc(text)}</textarea></div><div class="row"><button class="btn primary" data-copy="#copyText">Copiar</button><button class="btn" data-close>Fechar</button></div>`)}
async function runAutomations(){let created=0;const has=(title)=>state.tasks.some(t=>t.title===title&&!t.done);const addTask=(title,due,link)=>{if(!has(title)){state.tasks.push({id:uid(),title,due,dueDate:due,priority:'alta',link,done:false,createdAt:now()});created++}};if(state.config.automations.lead3)state.leads.filter(l=>!['FECHADO','PERDIDO'].includes(l.stage)&&daysDiff(l.contactAt?.slice(0,10)||l.createdAt?.slice(0,10)||today())<=-3).forEach(l=>addTask('Follow-up: '+l.name,today(),l.id));if(state.config.automations.proposal5)state.leads.filter(l=>l.stage==='PROPOSTA'&&daysDiff(l.proposalAt?.slice(0,10)||l.createdAt?.slice(0,10)||today())<=-5).forEach(l=>addTask('Toque D5: '+l.name,today(),l.id));if(state.config.automations.installment3)state.contracts.flatMap(c=>c.installments.map(i=>({c,i}))).filter(x=>x.i.status!=='paid'&&daysDiff(x.i.dueDate)===3).forEach(x=>addTask('Enviar lembrete: '+x.c.client,today(),x.i.id));if(state.config.automations.hearing1)state.deadlines.filter(d=>d.type==='hearing'&&daysDiff(d.date)===1).forEach(d=>addTask('Confirmar cliente: '+d.title,today(),d.id));if(created)await sset('tasks',state.tasks)}
function tasksModal(){openModal(`<h3>Tarefas</h3><div class="list">${state.tasks.filter(t=>!t.done).map(t=>`<div class="item"><div class="between"><strong>${esc(t.title)}</strong><span>${dateBR(t.due)}</span></div><button class="btn small primary" style="margin-top:7px" data-done="${t.id}">Concluir</button></div>`).join('')||'<div class="empty">Nenhuma tarefa pendente.</div>'}</div><button class="btn" style="margin-top:10px" data-close>Fechar</button>`)}
async function doneTask(id){const t=state.tasks.find(x=>x.id===id);if(t){t.done=true;await persist('tasks');closeModal();toast('Tarefa concluída')}}
document.addEventListener('click',async e=>{const a=e.target.closest('[data-action]');if(a){const act=a.dataset.action,id=a.dataset.id;if(act==='new-lead')leadModal();if(act==='lead-detail')leadDetail(id);if(act==='new-client')clientModal();if(act==='new-process')state.clients.length?processModal():toast('Crie um cliente primeiro');if(act==='new-deadline')deadlineModal();if(act==='new-contract')contractModal();if(act==='contract-detail')contractDetail(id);if(act==='followup')followup(id);if(act==='charge')charge(id,a.dataset.installment);if(act==='pay')pay(id,a.dataset.installment);if(act==='client-summary')clientSummary(id);if(act==='process-detail')processModalExisting(id);if(act==='ics')ics(id);if(act==='publication')publication();if(act==='go-tasks')tasksModal();if(act==='run-auto'){await runAutomations();render();toast('Regras executadas')}if(act==='wa-status')waStatus();if(act==='wa-sync')waSync();if(act==='wa-sync-chats')waSyncChats();if(act==='wa-setup')waSetup();if(act==='wa-compose')waCompose();if(act==='wa-open')waOpen(id);if(act==='wa-select'){nav('commercial');await waSelect(id);}if(act==='wa-agent')waAgent(id);if(act==='wa-mark-read')waMarkRead(id);if(act==='wa-inline-send')waInlineSend(id)}const mv=e.target.closest('[data-move]');if(mv)moveLead(mv.dataset.id,mv.dataset.move);const cl=e.target.closest('[data-closelead]');if(cl)closeLead(cl.dataset.closelead);const lo=e.target.closest('[data-lost]');if(lo)lostLead(lo.dataset.lost);const ed=e.target.closest('[data-edit]');if(ed){closeModal();leadModal(state.leads.find(x=>x.id===ed.dataset.edit))}const fo=e.target.closest('[data-follow]');if(fo)followup(fo.dataset.follow);const cp=e.target.closest('[data-copy]');if(cp)copyText(cp.dataset.copy);const dt=e.target.closest('[data-done]');if(dt)doneTask(dt.dataset.done);const wq=e.target.closest('[data-waquick]');if(wq){const t=$('waQuick')?.value?.trim();const c=state.whatsappChats.find(x=>x.id===wq.dataset.waquick);if(t&&c)waSend(c.phone,t).then(()=>closeModal())}if(e.target.closest('[data-close]'))closeModal();});

async function endProcess(id){const p=state.processes.find(x=>x.id===id);if(!p)return;openModal(`<h3>Encerrar processo</h3><form id="endForm"><div class="field"><label>Resultado</label><select name="result"><option>favorável</option><option>parcialmente favorável</option><option>desfavorável</option><option>acordo</option><option>arquivado</option></select></div><div class="field"><label>Aprendizado (1 linha)</label><input name="learning" required placeholder="O que este caso ensina para os próximos?"></div><div class="row"><button class="btn primary">Salvar encerramento</button><button type="button" class="btn" data-close>Cancelar</button></div></form>`);$('endForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);p.phase='Encerrado';p.result=f.get('result');p.closedAt=now();state.learnings.push({id:uid(),text:f.get('learning'),source:'processo '+p.number,result:p.result,createdAt:now()});await Promise.all([sset('processes',state.processes),sset('learnings',state.learnings)]);closeModal();render();toast('Processo encerrado e aprendizado salvo')}}
function processModalExisting(id){const p=state.processes.find(x=>x.id===id);if(!p)return;openModal(`<h3>${esc(p.number)}</h3><div class="item"><div class="statline"><span>Cliente</span><strong>${esc(p.clientName)}</strong></div><div class="statline"><span>Tribunal</span><span>${esc(p.court)}</span></div><div class="statline"><span>Fase</span><span>${esc(p.phase)}</span></div><div class="statline"><span>Pasta</span><span class="mono">${esc(p.folder)}</span></div></div><div class="row" style="margin-top:10px"><button class="btn" data-summary="${p.id}">Resumo cliente</button>${p.phase!=='Encerrado'?`<button class="btn danger" data-end-process="${p.id}">Encerrar processo</button>`:''}<button class="btn" data-close>Fechar</button></div>`)}
document.addEventListener('click',e=>{const s=e.target.closest('[data-summary]');if(s)clientSummary(s.dataset.summary);const ep=e.target.closest('[data-end-process]');if(ep)endProcess(ep.dataset.endProcess)});
init();
})();
</script>
</body>
</html>
