<style>
:root{--bg:#090a0c;--panel:#111318;--panel2:#171a20;--line:#292d35;--text:#f4f5f7;--muted:#9299a6;--accent:#d8ff4f;--danger:#ff6b6b;--warn:#ffd166;--ok:#67e8a5;--shadow:0 16px 50px rgba(0,0,0,.32)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}body{min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;padding-bottom:86px}.top{position:sticky;top:0;z-index:20;background:rgba(9,10,12,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center}.brand-mark{width:30px;height:30px;border:1px solid var(--accent);display:grid;place-items:center;border-radius:9px;color:var(--accent);font-family:'DM Mono'}.brand h1{font:650 21px Fraunces;margin:0}.sub{font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);width:38px;height:38px;border-radius:10px}.banner{margin:12px 16px 0;padding:11px 13px;border:1px solid var(--warn);background:rgba(255,209,102,.08);color:#ffe7a3;border-radius:10px;font-size:12px;display:none}.banner.error{border-color:var(--danger);background:rgba(255,107,107,.08);color:#ffb2b2}.main{max-width:1180px;margin:auto;padding:16px}.view{display:none}.view.active{display:block}.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:8px 0 18px}.eyebrow{font:500 10px 'DM Mono';letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}h2{font:650 28px Fraunces;margin:3px 0 0}.grid{display:grid;gap:12px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:linear-gradient(180deg,var(--panel),#0e1014);border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--shadow)}.metric{min-height:115px}.metric .num{font-size:28px;font-weight:800;margin-top:7px}.metric .label{color:var(--muted);font-size:12px}.progress{height:8px;background:#252931;border-radius:99px;overflow:hidden;margin:12px 0 7px}.progress i{display:block;height:100%;background:var(--accent);border-radius:inherit}.status{font-size:11px;color:var(--muted)}.good{color:var(--ok)}.bad{color:var(--danger)}.warn{color:var(--warn)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:9px;font-weight:700;font-size:12px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#101300}.btn.danger{border-color:#73373b;color:#ffb2b2}.btn.small{padding:7px 9px;font-size:11px}.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:var(--muted)}.mono{font-family:'DM Mono';font-size:11px}.list{display:grid;gap:8px}.item{border:1px solid var(--line);background:#0e1014;border-radius:11px;padding:11px}.item.fatal{border-color:#74353a;background:rgba(255,107,107,.06)}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.empty strong{display:block;color:var(--text);margin-bottom:6px}.kanban{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:10px;overflow:auto;padding-bottom:8px}.lane{min-height:360px;background:#0d0f13;border:1px solid var(--line);border-radius:13px;padding:9px}.lane h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:4px 4px 10px;color:var(--muted)}.lead-card{padding:11px;border:1px solid var(--line);background:var(--panel);border-radius:10px;margin-bottom:8px}.lead-card h4{margin:0 0 5px;font-size:13px}.lead-card p{margin:3px 0;color:var(--muted);font-size:11px}.badge{display:inline-flex;padding:3px 6px;border-radius:99px;border:1px solid var(--line);font-size:9px;color:var(--muted);text-transform:uppercase}.badge.hot{color:#ffe39b;border-color:#6b5830}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;align-items:flex-end;justify-content:center}.modal-backdrop.open{display:flex}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:#0d0f13;border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px}.modal h3{font:650 22px Fraunces;margin:0 0 14px}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.field input,.field select,.field textarea{width:100%;background:#090b0e;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px;outline:none}.field textarea{min-height:105px;resize:vertical}.more{margin-top:8px;border-top:1px solid var(--line);padding-top:10px}.more summary{font-size:11px;color:var(--muted);cursor:pointer;margin-bottom:10px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(12,13,16,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px max(8px,env(safe-area-inset-left)) max(7px,env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:var(--muted);padding:7px 3px;font-size:10px}.nav button.active{color:var(--accent)}.nav b{display:block;font-size:16px;margin-bottom:2px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:9px 7px;white-space:nowrap}.chat{display:flex;flex-direction:column;min-height:65vh}.messages{display:grid;gap:10px;flex:1;margin-bottom:10px}.bubble{max-width:92%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);white-space:pre-wrap;font-size:12px;line-height:1.45}.bubble.user{justify-self:end;background:#1b2010;border-color:#3b4820}.bubble.ai{justify-self:start;background:#101218}.chips{display:flex;gap:7px;overflow:auto;padding:3px 0 9px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 9px;border-radius:99px;font-size:10px}.composer{display:grid;grid-template-columns:1fr auto;gap:7px}.composer textarea{background:#0c0e12;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:10px;min-height:48px}.toast{position:fixed;right:14px;bottom:90px;background:#171a20;border:1px solid var(--line);padding:10px 12px;border-radius:10px;font-size:11px;z-index:80;display:none}.toast.show{display:block}.danger-zone{border-color:#4b2b2f}.wa-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.wa-dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#666}.wa-dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(103,232,165,.08)}.wa-dot.off{background:var(--danger)}.wa-chat{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.wa-avatar{width:34px;height:34px;border-radius:10px;background:#171a20;border:1px solid var(--line);display:grid;place-items:center;font:500 12px 'DM Mono';color:var(--accent)}.wa-msg{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wa-mode{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.wa-compose{display:grid;grid-template-columns:1fr auto;gap:7px}.wa-compose textarea{width:100%;min-height:54px;background:#090b0e;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px}.wa-note{font-size:10px;line-height:1.4;color:var(--muted)}.wa-thread{max-height:330px;overflow:auto;display:grid;gap:8px;padding:4px 0}.wa-bubble{padding:9px 10px;border:1px solid var(--line);border-radius:10px;max-width:88%;white-space:pre-wrap;font-size:11px;line-height:1.4}.wa-bubble.in{justify-self:start;background:#101218}.wa-bubble.out{justify-self:end;background:#1b2010;border-color:#3b4820}.wa-time{display:block;font:9px 'DM Mono';color:#666;margin-top:4px}.wa-setup{border:1px dashed #4a4e58;background:#0d0f13}.wa-inbox{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:520px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0b0d10}.wa-sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.wa-search{padding:10px;border-bottom:1px solid var(--line)}.wa-search input{width:100%;background:#090b0e;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px}.wa-chatlist{overflow:auto;flex:1}.wa-chatrow{display:grid;grid-template-columns:auto 1fr auto;gap:9px;padding:11px;border:0;border-bottom:1px solid #1d2027;background:transparent;color:var(--text);width:100%;text-align:left}.wa-chatrow:hover,.wa-chatrow.selected{background:#15181e}.wa-chatrow .wa-unread{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:#101300;font-size:9px;font-weight:800;display:grid;place-items:center}.wa-main{display:flex;flex-direction:column;min-width:0}.wa-mainhead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.wa-thread-inline{flex:1;overflow:auto;padding:14px;display:grid;gap:8px;align-content:start;min-height:300px;max-height:430px}.wa-compose-inline{padding:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px}.wa-compose-inline textarea{width:100%;min-height:48px;max-height:120px;background:#090b0e;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px;resize:vertical}.wa-last{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:760px){.wa-inbox{grid-template-columns:1fr;min-height:0}.wa-sidebar{border-right:0;border-bottom:1px solid var(--line);max-height:290px}.wa-thread-inline{max-height:420px}.wa-main{min-height:480px}}.detail{display:none}.detail.open{display:block}.statline{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin:7px 0}.pillbar{height:7px;background:#242831;border-radius:99px;display:flex;overflow:hidden}.pillbar i{display:block;background:var(--accent)}@media(max-width:760px){.grid3{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.main{padding:13px}.kanban{grid-template-columns:repeat(5,220px)}h2{font-size:25px}.metric{min-height:100px}.top{padding:12px 13px}}@media(max-width:440px){.grid3{grid-template-columns:1fr 1fr}.card{padding:12px}.metric .num{font-size:24px}}
.wa-agentbar{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:#0e1014;border-radius:11px;padding:10px 12px;margin-bottom:10px}.wa-queue{border:1px dashed var(--line);background:#0d0f13;border-radius:11px;padding:10px 12px;margin-bottom:12px}.wa-queue>div{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}.badge.good{color:var(--ok);border-color:#315c46}
</style>

<body>
<div class="app" id="app">
<header class="top"><div class="brand"><div class="brand-mark">N</div><div><h1>NAVE CRM</h1><div class="sub" id="officeName">Escritório</div></div></div><button class="icon-btn" id="settingsBtn" title="Configurações">⚙</button></header>
<div id="storageBanner" class="banner"></div><div id="errorBanner" class="banner error"></div>
<main class="main">
<section id="view-dashboard" class="view active"></section>
<section id="view-commercial" class="view"></section>
<section id="view-legal" class="view"></section>
<section id="view-finance" class="view"></section>
<section id="view-assistant" class="view"></section>
</main>
<nav class="nav"><button data-view="dashboard" class="active"><b>⌂</b>Painel</button><button data-view="commercial"><b>◎</b>Comercial</button><button data-view="legal"><b>§</b>Jurídico</button><button data-view="finance"><b>¤</b>Financeiro</button><button data-view="assistant"><b>✦</b>Assistente</button></nav>
</div>
<div id="modalBackdrop" class="modal-backdrop"><div class="modal" id="modal"></div></div><div id="toast" class="toast"></div>
<footer style="position:fixed;right:10px;bottom:77px;color:#555;font:9px 'DM Mono';pointer-events:none">NAVE: WhatsApp via Zappfy. O agente autônomo opera enquanto o NAVE estiver aberto, sincronizando a Zappfy no intervalo configurado. Para execução 24/7 em segundo plano, é necessário relay/backend público; o NAVE não finge possuir esse serviço.</footer>
<script>
(() => {
'use strict';
const KEYS=['config','leads','clients','contracts','processes','deadlines','tasks','learnings','chat','whatsappChats','whatsappMessages','waAgentLogs'];
const PREFIX='crm-';
const volatile=new Map();
const hasDesktopStore=!!(window.storage&&typeof window.storage.get==='function'&&typeof window.storage.set==='function');
let storageMode=hasDesktopStore?'desktop':(()=>{try{const t='__nave_test__';localStorage.setItem(t,'1');localStorage.removeItem(t);return 'local'}catch(e){return 'memory'}})();
let state={waSelectedChatId:''};
const $=id=>document.getElementById(id);
const uid=()=>crypto?.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>new Date().toISOString().slice(0,10);
const now=()=>new Date().toISOString();
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);
const dateBR=v=>v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR'): '—';
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const daysDiff=(a,b=today())=>Math.floor((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/86400000);
const clone=x=>JSON.parse(JSON.stringify(x));
const defaultConfig={office:'NAVE Advocacia',lawyer:'',oab:'',goal:30000,pix:'',anthropicApiKey:'',aiModel:'claude-sonnet-4-6',automations:{lead3:true,proposal5:true,installment3:true,hearing1:true},whatsapp:{enabled:true,baseUrl:'https://api.zappfy.io',token:'',instanceId:'',phone:'',mode:'autonomo',sendPath:'/send/text',webhookUrl:'',polling:true,pollMs:30000,agentEnabled:true,agentName:'Atendimento do Escritório',autoReply:true,createLead:true,createTasks:true,transferAfterTriage:true}};
async function sget(k){try{if(storageMode==='desktop'){const r=await window.storage.get(PREFIX+k);if(r?.value!=null)return JSON.parse(r.value)}else if(storageMode==='local'){const v=localStorage.getItem(PREFIX+k);if(v!=null)return JSON.parse(v)}}catch(e){console.error('sget '+k,e)}return volatile.has(k)?clone(volatile.get(k)):null}
async function sset(k,v){const data=JSON.stringify(v);try{if(storageMode==='desktop'){await window.storage.set(PREFIX+k,data);return}if(storageMode==='local'){localStorage.setItem(PREFIX+k,data);return}}catch(e){console.error('sset '+k,e);storageMode='memory';showStorageFallback()}volatile.set(k,clone(v))}
function showStorageFallback(){$('storageBanner').style.display='block';$('storageBanner').textContent='Modo degradado: o armazenamento persistente não está disponível. Os dados ficam apenas na memória desta sessão e serão perdidos ao recarregar.'}
async function apiFetch(url,opts){if(window.naveDesktop&&typeof window.naveDesktop.fetch==='function'){const r=await window.naveDesktop.fetch(url,opts||{});return {ok:!!r.ok,status:r.status,json:async()=>JSON.parse(r.body||'null'),text:async()=>r.body||''}}return fetch(url,opts)}
async function init(){for(const k of KEYS)state[k]=await sget(k);state.config={...defaultConfig,...(state.config||{}),automations:{...defaultConfig.automations,...(state.config?.automations||{})},whatsapp:{...defaultConfig.whatsapp,...(state.config?.whatsapp||{})}};for(const k of KEYS.filter(k=>k!=='config'))if(!Array.isArray(state[k]))state[k]=[];await sset('config',state.config);state.whatsappChats=(Array.isArray(state.whatsappChats)?state.whatsappChats:[]).filter(c=>!waIsGroup(c));await sset('whatsappChats',state.whatsappChats);if(storageMode==='memory')showStorageFallback(); $('officeName').textContent=state.config.office||'Escritório';render();await runAutomations();startWaAgentLoop();}
async function persist(k){await sset(k,state[k]);render();}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
window.addEventListener('error',e=>{const msg='Erro detectado: '+(e.message||'erro desconhecido');$('errorBanner').style.display='block';$('errorBanner').textContent=msg;console.error(e.error||e.message)});
window.addEventListener('unhandledrejection',e=>{const msg='Erro detectado: '+(e.reason?.message||String(e.reason));$('errorBanner').style.display='block';$('errorBanner').textContent=msg;console.error(e.reason)});
function nav(view){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('view-'+view).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===view));renderView(view)}
function render(){renderView(document.querySelector('.nav button.active')?.dataset.view||'dashboard');$('officeName').textContent=state.config.office||'Escritório'}
function renderView(v){if(v==='dashboard')renderDashboard();if(v==='commercial')renderCommercial();if(v==='legal')renderLegal();if(v==='finance')renderFinance();if(v==='assistant')renderAssistant()}
function openModal(html){$('modal').innerHTML=html;$('modalBackdrop').classList.add('open')}
function closeModal(){$('modalBackdrop').classList.remove('open');$('modal').innerHTML=''}
$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});
$('settingsBtn').onclick=()=>settingsModal();
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.view));
function settingsModal(){const c=state.config;openModal(`<h3>Configurações</h3><form id="settingsForm"><div class="field"><label>Escritório</label><input name="office" value="${esc(c.office)}"></div><div class="field"><label>Advogado</label><input name="lawyer" value="${esc(c.lawyer)}"></div><div class="field"><label>OAB</label><input name="oab" value="${esc(c.oab)}"></div><div class="field"><label>Meta mensal (R$)</label><input name="goal" type="number" min="0" step="100" value="${Number(c.goal)||0}"></div><details class="more" open><summary>Inteligência Artificial (Anthropic)</summary><div class="field"><label>Chave da API Anthropic</label><input name="anthropicKey" type="password" autocomplete="off" placeholder="sk-ant-..." value="${esc(c.anthropicApiKey||'')}"><div class="muted" style="font-size:10px">Obtenha em platform.claude.com → API Keys. Sem a chave, o Assistente e o agente de WhatsApp com IA ficam desativados; o restante do sistema funciona normalmente.</div></div><div class="field"><label>Modelo</label><input name="aiModel" value="${esc(c.aiModel||'claude-sonnet-4-6')}"></div></details><details class="more" open><summary>WhatsApp / Zappfy / Agente</summary><div class="field"><label>Token Zappfy</label><input name="waToken" type="password" autocomplete="off" value="${esc(c.whatsapp?.token||'')}"></div><div class="field"><label>Número</label><input name="waPhone" value="${esc(c.whatsapp?.phone||'')}"></div><div class="field"><label>Identidade exibida</label><input name="agentName" value="${esc(c.whatsapp?.agentName||'Atendimento do Escritório')}"><div class="muted" style="font-size:10px">Não usa “Júlia”. O agente atua como atendimento do escritório. Não se apresenta como Vilmar nem inventa identidade humana; se perguntarem, informa que é assistente virtual.</div></div><div class="field"><label>Modo</label><select name="waMode"><option value="autonomo" ${c.whatsapp?.mode==='autonomo'?'selected':''}>Autônomo — responde e faz a triagem</option><option value="copiloto" ${c.whatsapp?.mode==='copiloto'?'selected':''}>Copiloto — prepara, não envia</option><option value="humano" ${c.whatsapp?.mode==='humano'?'selected':''}>Humano — sem IA</option></select></div><div class="field"><label><input type="checkbox" name="agentEnabled" ${c.whatsapp?.agentEnabled!==false?'checked':''}> Agente ligado</label></div><div class="field"><label><input type="checkbox" name="autoReply" ${c.whatsapp?.autoReply!==false?'checked':''}> Responder automaticamente</label></div><div class="field"><label><input type="checkbox" name="createTasks" ${c.whatsapp?.createTasks!==false?'checked':''}> Criar tarefas para Vilmar</label></div><div class="field"><label>Intervalo de sincronização (segundos)</label><input name="pollSec" type="number" min=15 step=5 value="${Math.max(15,Math.round(Number(c.whatsapp?.pollMs||30000)/1000))}"></div></details><details class="more"><summary>Mais detalhes</summary><div class="field"><label>Chave PIX</label><input name="pix" value="${esc(c.pix)}"></div><div class="field"><label><input type="checkbox" name="lead3" ${c.automations.lead3?'checked':''}> Lead sem contato há 3 dias</label></div><div class="field"><label><input type="checkbox" name="proposal5" ${c.automations.proposal5?'checked':''}> Proposta parada há 5 dias</label></div><div class="field"><label><input type="checkbox" name="installment3" ${c.automations.installment3?'checked':''}> Parcela D-3</label></div><div class="field"><label><input type="checkbox" name="hearing1" ${c.automations.hearing1?'checked':''}> Audiência amanhã</label></div></details><div class="row"><button class="btn primary">Salvar</button><button type="button" class="btn" data-close>Fechar</button></div></form><div class="card danger-zone" style="margin-top:16px"><strong>Apagar todos os dados</strong><p class="muted" style="font-size:11px">A ação é irreversível nesta sessão. Use a confirmação abaixo.</p><button class="btn danger" id="wipeStart">Apagar dados</button><div id="wipeConfirm" style= function renderDashboard(){const el=$('view-dashboard'),d=dashboardData(),goal=Number(state.config.goal)||0,pct=goal?Math.min(100,d.paid/goal*100):0;const proposals=state.leads.filter(l=>l.stage==='PROPOSTA');const stopped=proposals.filter(l=>daysDiff(today(),l.proposalAt?.slice(0,10)||l.createdAt?.slice(0,10)||today())>=5);const alert=stopped.length?`${stopped.length} proposta(s) parada(s) há 5+ dias — dispare o toque D5.`:state.tasks.filter(t=>!t.done).length?`${state.tasks.filter(t=>!t.done).length} tarefa(s) pendente(s) exigem atenção.`:'Operação sem alerta crítico local.';el.innerHTML=`<div class="section-head"><div><div class="eyebrow">Visão 360</div><h2>Como está o escritório?</h2></div><button class="btn primary" data-action="new-lead">+ Lead</button></div><div class="grid grid3"><div class="card metric"><div class="label">Receita do mês</div><div class="num">${money(d.paid)}</div><div class="progress"><i style="width:${pct}%"></i></div><div class="status ${pct>=100?'good':'bad'}">${goal?`${pct.toFixed(0)}% da meta · ${pct>=100?'no ritmo':'abaixo do ritmo'}`:'Defina uma meta mensal'}</div></div><div class="card metric"><div class="label">Funil no mês</div><div class="num">${state.leads.filter(l=>l.createdAt?.slice(0,7)===d.month).length}</div><div class="status">${state.leads.filter(l=>l.stage==='PROPOSTA'&&l.createdAt?.slice(0,7)===d.month).length} propostas · ${state.leads.filter(l=>l.stage==='FECHADO'&&l.createdAt?.slice(0,7)===d.month).length} contratos</div></div><div class="card metric"><div class="label">Cobranças próximas</div><div class="num">${d.due7.length}</div><div class="status">${d.overdue.length} em atraso</div></div></div><div class="grid grid2" style="margin-top:12px"><div class="card"><div class="between"><strong>Próximos compromissos e prazos</strong><span class="badge">7 dias</span></div><div class="list" style="margin-top:10px">${d.upcoming.length?d.upcoming.map(x=>`<div class="item ${daysDiff(x.date)<=5?'fatal':''}"><div class="between function waIsGroup(c){

  const ids=[c.wa_chatid,c.chatid,c.chatId,c.jid,c.remoteJid,c.id,c.phone,c.number].filter(Boolean).map(String);
  if(ids.some(v=>/@g\.us(?:$|\?)/i.test(v)))return true;
  return c.isGroup===true||c.is_group===true||c.group===true||String(c.type||c.chatType||'').toLowerCase()==='group';
}
