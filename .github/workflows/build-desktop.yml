name: Build Desktop App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  testes:
    name: Testes E2E (12 cenários)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Playwright + Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Rodar testes E2E
        run: node tests/e2e.js

  windows:
    name: Windows (instalador + portátil)
    runs-on: windows-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Gerar instalador e versão portátil
        run: npx electron-builder --win --publish never

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: VGJ-LAW-Windows
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Anexar à release (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe

  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Gerar AppImage
        run: npx electron-builder --linux --publish never

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: VGJ-LAW-Linux
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Anexar à release (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
