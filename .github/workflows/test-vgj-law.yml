name: VGJ LAW Tests

on:
  pull_request:
  push:
    branches: ['claude/**']

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright + Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Rodar suíte E2E (12 cenários)
        run: node tests/e2e.js
