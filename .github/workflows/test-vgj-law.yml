name: VGJ LAW Tests

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

jobs:
  quality:
    name: Governance + syntax + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Governance contract
        run: node tests/governance.js

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find app -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check main.js
          node --check preload.js
          node --check tests/e2e.js

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Run E2E
        run: |
          CHROME=$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -n 1)
          test -n "$CHROME"
          PW_CHROMIUM="$CHROME" npm test
