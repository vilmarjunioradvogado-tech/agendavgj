name: VGJ LAW Tests

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install chromium

      - name: Run E2E
        env:
          PW_CHROMIUM: ${{ github.workspace }}/node_modules/playwright-core/.local-browsers/chromium-*/chrome-linux/chrome
        run: |
          CHROME=$(find node_modules/playwright-core/.local-browsers -type f -name chrome -o -name chromium | head -n 1)
          test -n "$CHROME"
          PW_CHROMIUM="$CHROME" npm test
