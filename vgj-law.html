function docRow(d) {
  const cls = { pendente: 'warn', recebido: '', aprovado: 'good', rejeitado: 'bad' }[d.status] || '';
  return `<div class="doc-row"><div><strong>${esc(d.name)}</strong><div class="cat">${esc(d.category)} · ${d.status === 'pendente' ? 'solicitado ' + dtBR(d.requestedAt) : 'recebido ' + dtBR(d.receivedAt)}</div></div>
    <span class="badge ${cls}">${esc(d.status)}</span>
    <span class="row">${d.status === 'recebido' ? `<button class="btn small" data-action="doc-status" data-id="${d.id}" data-status="aprovado">Aprovar</button><button class="btn small danger" data-action="doc-status" data-id="${d.id}" data-status="rejeitado">Rejeitar</button>` : d.status === 'pendente' ? `<button class="btn small" data-action="doc-status" data-id="${d.id}" data-status="recebido">Marcar recebido</button>` : ''}</span></div>`;
}
function contactEdit(id) {
  const c = id ? N.contactById(id) : null;
  openModal(`<h3>${c ? 'Editar contato' : 'Novo contato'}</h3><form id="contactForm">
  <div class="field"><label>Nome</label><input name="name" required value="${esc(c?.name || '')}"></div>
  <div class="grid grid2"><div class="field"><label>Telefone/WhatsApp</label><input name="phone" value="${esc(c?.phone || '')}"></div>
  <div class="field"><label>E-mail</label><input name="email" value="${esc(c?.email || '')}"></div>
  <div class="field"><label>CPF</label><input name="cpf" value="${esc(c?.cpf || '')}"></div>
  <div class="field"><label>Origem</label><select name="origin">${N.ORIGINS.map(o => `<option value="${o}" ${c?.origin === o ? 'selected' : ''}>${N.originLabel(o)}</option>`).join('')}</select></div>
  <div class="field"><label>Status</label><select name="status">${['lead', 'cliente', 'inativo'].map(s => `<option ${c?.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
  <div class="field"><label>Tags (separadas por vírgula)</label><input name="tags" value="${esc((c?.tags || []).join(', '))}"></div></div>
  <div class="field"><label>Observações</label><textarea name="notes">${esc(c?.notes || '')}</textarea></div>
  <div class="row"><button class="btn primary">Salvar</button><button type="button" class="btn" data-close>Cancelar</button></div></form>`);
  $('contactForm').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const data = { name: f.get('name'), phone: f.get('phone'), whatsapp: f.get('phone'), email: f.get('email'), cpf: f.get('cpf'),
      origin: f.get('origin'), status: f.get('status'), notes: f.get('notes'), tags: String(f.get('tags') || '').split(',').map(t => t.trim()).filter(Boolean) };
    if (c) await N.updateContact(c.id, data, 'vilmar'); else {
      const dup = N.findContact({ phone: data.phone, cpf: data.cpf, email: data.email });
      if (dup) { toast('Já existe: ' + dup.name + ' — abrindo cadastro existente'); closeModal(); contactDetail(dup.id); return; }
      await N.createContact(data, 'vilmar');
    }
    closeModal(); N.render(); toast('Contato salvo');
  };
}
function companyEdit(id) {
  const c = id ? S.companies.find(x => x.id === id) : null;
  openModal(`<h3>${c ? 'Editar empresa' : 'Nova empresa'}</h3><form id="companyForm">
  <div class="field"><label>Razão social</label><input name="razaoSocial" required value="${esc(c?.razaoSocial || '')}"></div>
  <div class="grid grid2"><div class="field"><label>Nome fantasia</label><input name="nomeFantasia" value="${esc(c?.nomeFantasia || '')}"></div>
  <div class="field"><label>CNPJ</label><input name="cnpj" value="${esc(c?.cnpj || '')}"></div></div>
  <div class="field"><label>Observações</label><textarea name="notes">${esc(c?.notes || '')}</textarea></div>
  <div class="row"><button class="btn primary">Salvar</button><button type="button" class="btn" data-close>Cancelar</button></div></form>`);
  $('companyForm').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    if (c) { c.razaoSocial = f.get('razaoSocial'); c.nomeFantasia = f.get('nomeFantasia'); c.cnpj = f.get('cnpj'); c.notes = f.get('notes'); c.updatedAt = N.now(); await N.sset('companies', S.companies); }
    else await N.createCompany({ razaoSocial: f.get('razaoSocial'), nomeFantasia: f.get('nomeFantasia'), cnpj: f.get('cnpj'), notes: f.get('notes') }, 'vilmar');
    closeModal(); N.render(); toast('Empresa salva');
  };
}
function companyDetail(id) {
  const e = S.companies.find(x => x.id === id); if (!e) return;
  const cases = S.cases.filter(k => k.companyId === id);
  const contacts = e.contactIds.map(cid => N.contactById(cid)).filter(Boolean);
  openModal(`<h3>${esc(e.razaoSocial)}</h3>
  <div class="kv"><b>CNPJ</b><span>${esc(e.cnpj || '—')}</span><b>Fantasia</b><span>${esc(e.nomeFantasia || '—')}</span></div>
  ${e.notes ? `<div class="item" style="margin-top:8px">${esc(e.notes)}</div>` : ''}
  <div class="row" style="margin-top:10px"><button class="btn small" data-action="company-edit" data-id="${e.id}">Editar</button></div>
  <details class="more" open><summary>Contatos vinculados (${contacts.length})</summary><div class="list">${contacts.map(c => `<div class="item clickable" data-action="contact-detail" data-id="${c.id}"><strong>${esc(c.name)}</strong> <span class="muted">${esc(c.phone)}</span></div>`).join('') || '<div class="empty">Nenhum — vincule pelo cadastro da pessoa.</div>'}</div></details>
  <details class="more" open><summary>Demandas (${cases.length})</summary><div class="list">${cases.map(k => `<div class="item clickable" data-action="case-detail" data-id="${k.id}"><div class="between"><strong>${esc(k.title)}</strong><span class="badge">${esc(stageName(k.stageId))}</span></div></div>`).join('') || '<div class="empty">Nenhuma.</div>'}</div></details>
  <div class="row" style="margin-top:12px"><button class="btn" data-close>Fechar</button></div>`);
}
function linkCompanyModal(contactId) {
  const c = N.contactById(contactId); if (!c) return;
  openModal(`<h3>Vincular empresa a ${esc(c.name)}</h3>
  ${S.companies.length ? `<form id="linkForm"><div class="field"><label>Empresa</label><select name="companyId">${S.companies.map(e => `<option value="${e.id}">${esc(e.razaoSocial)}</option>`).join('')}</select></div>
  <div class="row"><button class="btn primary">Vincular</button><button type="button" class="btn" data-close>Cancelar</button></div></form>` :
  '<div class="empty"><strong>Nenhuma empresa cadastrada</strong></div><button class="btn primary" data-action="new-company">+ Nova empresa</button>'}`);
  const f = $('linkForm');
  if (f) f.onsubmit = async e => { e.preventDefault(); await N.linkContactCompany(contactId, new FormData(e.target).get('companyId')); closeModal(); toast('Vinculado'); contactDetail(contactId); };
}

/* ---------- demanda: criação e detalhe ---------- */
function caseEdit(kaseId, presetContactId) {
  const k = kaseId ? N.caseById(kaseId) : null;
  openModal(`<h3>${k ? 'Editar demanda' : 'Nova demanda'}</h3><form id="caseForm">
  <div class="field"><label>Título</label><input name="title" required value="${esc(k?.title || '')}" placeholder="Ex.: Negativa de cobertura — cirurgia"></div>
  <div class="field"><label>Cliente</label><select name="contactId" ${k ? 'disabled' : ''}>${S.contacts.map(c => `<option value="${c.id}" ${(k?.contactId || presetContactId) === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('') || '<option value="">— cadastre um contato antes —</option>'}</select></div>
  <div class="grid grid2">
  <div class="field"><label>Área</label><select name="area">${S.triageFlows.map(f => `<option value="${f.area}" ${k?.area === f.area ? 'selected' : ''}>${esc(f.label)}</option>`).join('')}</select></div>
  <div class="field"><label>Origem</label><select name="origin">${N.ORIGINS.map(o => `<option value="${o}" ${k?.origin === o ? 'selected' : ''}>${N.originLabel(o)}</option>`).join('')}</select></div>
  <div class="field"><label>Urgência</label><select name="urgency">${['baixa', 'normal', 'alta', 'critica'].map(u => `<option ${(k?.urgency || 'normal') === u ? 'selected' : ''}>${u}</option>`).join('')}</select></div>
  <div class="field"><label>Valor potencial (R$)</label><input name="value" type="number" step="100" value="${Number(k?.value) || 0}"></div>
  <div class="field"><label>Prazo interno</label><input name="dueDate" type="date" value="${esc(k?.dueDate || '')}"></div>
  <div class="field"><label>Empresa (opcional)</label><select name="companyId"><option value="">—</option>${S.companies.map(e => `<option value="${e.id}" ${k?.companyId === e.id ? 'selected' : ''}>${esc(e.razaoSocial)}</option>`).join('')}</select></div></div>
  <div class="field"><label>Assunto / relato</label><textarea name="subject">${esc(k?.subject || '')}</textarea></div>
  <div class="row"><button class="btn primary">Salvar</button><button type="button" class="btn" data-close>Cancelar</button></div></form>`);
  $('caseForm').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const data = { title: f.get('title'), area: f.get('area'), origin: f.get('origin'), urgency: f.get('urgency'),
      value: Number(f.get('value') || 0), dueDate: f.get('dueDate'), subject: f.get('subject'), companyId: f.get('companyId') || '' };
    if (k) await N.updateCase(k.id, data, 'vilmar');
    else {
      const contactId = f.get('contactId');
      if (!contactId) { toast('Cadastre um contato primeiro'); return; }
      await N.createCase({ ...data, contactId }, 'vilmar');
    }
    closeModal(); N.render(); toast('Demanda salva');
  };
}
function caseDetail(id) {
  const k = N.caseById(id); if (!k) return;
  const c = N.contactById(k.contactId);
  const docs = N.caseDocs(id);
  const tasks = N.caseTasks(id);
  const appts = S.appointments.filter(a => a.caseId === id);
  const flow = N.flowByArea(k.area);
  const tl = N.timelineFor({ caseId: id });
  const idx = N.stageIndex(k.stageId);
  openModal(`<h3>${esc(k.title)}</h3>
  <div class="kv"><b>Cliente</b><span>${c ? `<a href="#" data-action="contact-detail" data-id="${c.id}" style="color:var(--accent)">${esc(c.name)}</a>` : '—'}</span>
  <b>Área</b><span>${esc(flow?.label || k.area)}</span><b>Estágio</b><span>${esc(stageName(k.stageId))}</span>
  <b>Status</b><span>${esc(k.status)}</span><b>Urgência</b><span>${esc(k.urgency)}</span><b>Origem</b><span>${esc(N.originLabel(k.origin))}</span>
  <b>Valor</b><span>${k.value ? money(k.value) : '—'}</span><b>Prazo</b><span>${k.dueDate ? dateBR(k.dueDate) : '—'}</span>
  <b>Entrada</b><span>${dtBR(k.createdAt)}</span><b>Última mov.</b><span>${dtBR(k.lastInteraction)}</span></div>
  ${k.subject ? `<div class="item" style="margin-top:8px"><strong style="font-size:11px">RELATO</strong><div style="font-size:12px;white-space:pre-wrap">${esc(k.subject)}</div></div>` : ''}
  <div class="row" style="margin-top:10px">
    <select id="caseMoveSel" class="btn" style="font-weight:400">${N.stages().map(s => `<option value="${s.id}" ${s.id === k.stageId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
    <button class="btn small primary" data-action="case-move" data-id="${k.id}">Mover</button>
    <button class="btn small" data-action="case-edit" data-id="${k.id}">Editar</button>
    <button class="btn small" data-action="case-summary" data-id="${k.id}">Gerar resumo</button>
    <button class="btn small" data-action="case-request-docs" data-id="${k.id}">Solicitar docs da área</button>
    <button class="btn small danger" data-action="case-lost" data-id="${k.id}">Perdida</button></div>
  ${k.summary ? `<details class="more" open><summary>Resumo para Vilmar (${dtBR(k.summary.at)})</summary><div class="summary-card">${esc(k.summary.text)}</div></details>` : ''}
  ${(k.triageAnswers || []).length ? `<details class="more" open><summary>Triagem (${k.triageAnswers.length})</summary><div class="list">${k.triageAnswers.map(a => `<div class="item" style="font-size:12px">${esc(a)}</div>`).join('')}</div></details>` : ''}
  <details class="more" open><summary>Documentos (${docs.length})</summary>
    <div class="row" style="margin-bottom:8px"><button class="btn small" data-action="doc-add" data-id="${k.id}">+ Registrar documento</button><button class="btn small" data-action="doc-request-custom" data-id="${k.id}">+ Solicitar documento</button></div>
    <div class="list">${docs.map(d => docRow(d)).join('') || '<div class="empty">Nenhum documento.</div>'}</div></details>
  <details class="more"><summary>Tarefas (${tasks.length})</summary><div class="list">${tasks.map(t => `<div class="item"><div class="between"><strong>${esc(t.title)}</strong><span>${t.status === 'concluida' ? '<span class="badge good">concluída</span>' : `<button class="btn small" data-action="task-done" data-id="${t.id}">Concluir</button>`}</span></div></div>`).join('') || '<div class="empty">Nenhuma.</div>'}</div></details>
  <details class="more"><summary>Reuniões (${appts.length})</summary><div class="list">${appts.map(a => `<div class="item"><div class="between"><strong>${dateBR(a.date)} ${a.time}</strong><span class="badge">${esc(a.status)}</span></div></div>`).join('') || '<div class="empty">Nenhuma.</div>'}</div></details>
  <details class="more"><summary>Histórico</summary><div class="timeline">${tl.map(t => `<div class="tl"><span class="when">${dtBR(t.at)}</span><span>${esc(t.text)}</span></div>`).join('') || '<div class="empty">Sem eventos.</div>'}</div></details>
  <div class="row" style="margin-top:12px"><button class="btn" data-close>Fechar</button></div>`);
}

/* editor de estágios do funil */
function stagesEditor() {
  openModal(`<h3>Estágios do funil</h3><div class="list" id="stageList">${N.stages().map((s, i) => `
    <div class="item"><div class="between"><strong>${i + 1}. ${esc(s.name)}</strong><span class="row">
    <button class="btn small" data-action="stage-up" data-id="${s.id}">↑</button>
    <button class="btn small" data-action="stage-rename" data-id="${s.id}">Renomear</button>
    <button class="btn small danger" data-action="stage-del" data-id="${s.id}">Excluir</button></span></div>
    <div class="muted mono" style="font-size:10px">${s.id} · ${S.cases.filter(k => k.stageId === s.id && k.status === 'aberto').length} demanda(s)</div></div>`).join('')}</div>
  <div class="row" style="margin-top:10px"><button class="btn primary" data-action="stage-add">+ Estágio</button><button class="btn" data-close>Fechar</button></div>`);
}

Object.assign(N, { contactDetail, contactEdit, companyEdit, companyDetail, linkCompanyModal, caseEdit, caseDetail, stagesEditor, docRow, chatCase });
})();

</script>
<script>
/* NAVE — telas: Agenda, Tarefas, Jurídico, Financeiro, Assistente, Sistema, Configurações */
(() => {
'use strict';
const N = window.NAVE, S = N.state;
const { $, esc, money, dateBR, dtBR, today, now, addDays, daysDiff, openModal, closeModal, toast, uid, sset } = N;

/* ============================== AGENDA ============================== */
N.views.agenda = function renderAgenda() {
  const el = $('view-agenda');
  const days = [0, 1, 2, 3, 4, 5, 6].map(n => addDays(today(), n));
  const upcoming = S.appointments.filter(a => a.date >= today() && a.status !== 'cancelado').sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  el.innerHTML = `<div class="section-head"><div><div class="eyebrow">Agenda operacional</div><h2>Agenda</h2></div>
    <button class="btn primary" data-action="new-appointment">+ Compromisso</button></div>
  <div class="grid grid2"><div class="card"><strong>Próximos 7 dias</strong>
    <div class="list" style="margin-top:10px">${days.map(d => {
      const appts = S.appointments.filter(a => a.date === d && a.status !== 'cancelado').sort((a, b) => a.time.localeCompare(b.time));
      const free = N.checkCalendar(d);
      return `<div class="item"><div class="between"><strong>${dateBR(d)}${d === today() ? ' · hoje' : ''}</strong><span class="muted" style="font-size:10px">${free.length ? free.length + ' horário(s) livre(s)' : (N.slotsForDate(d).length ? 'lotado' : 'sem expediente')}</span></div>
      ${appts.map(a => `<div class="between" style="margin-top:6px;font-size:12px"><span>🕐 ${a.time} — ${esc(a.title)} ${a.contactId ? '(' + esc(N.contactById(a.contactId)?.name || '') + ')' : ''}</span>
        <span class="row"><span class="badge">${esc(a.status)}</span>
        ${['agendado', 'remarcado'].includes(a.status) ? `<button class="btn small" data-action="appt-status" data-id="${a.id}" data-status="confirmado">Confirmar</button>` : ''}
        ${a.status !== 'realizado' ? `<button class="btn small" data-action="appt-reschedule" data-id="${a.id}">Remarcar</button>
        <button class="btn small" data-action="appt-status" data-id="${a.id}" data-status="realizado">Realizada</button>
        <button class="btn small danger" data-action="appt-status" data-id="${a.id}" data-status="cancelado">Cancelar</button>` : ''}</span></div>`).join('') || '<div class="muted" style="font-size:11px;margin-top:5px">Sem compromissos.</div>'}</div>`;
    }).join('')}</div></div>
  <div class="card"><strong>Todos os próximos (${upcoming.length})</strong>
    <div class="list" style="margin-top:10px">${upcoming.slice(0, 20).map(a => {
      const c = N.contactById(a.contactId);
      return `<div class="item"><div class="between"><strong>${dateBR(a.date)} ${a.time} — ${esc(a.title)}</strong><span class="badge">${esc(a.status)}</span></div>
      <div class="muted" style="font-size:11px">${c ? esc(c.name) : 'sem cliente'}${a.caseId ? ' · ' + esc(N.caseById(a.caseId)?.title || '') : ''}</div></div>`;
    }).join('') || '<div class="empty"><strong>Agenda livre</strong>O agente de IA agenda automaticamente quando o cliente pede.</div>'}</div>
    <div class="wa-note" style="margin-top:8px">Expediente: ${S.config.agenda.startHour}h–${S.config.agenda.endHour}h, dias úteis. Ajuste em ⚙ Configurações.</div></div></div>`;
};

function appointmentModal(apptId) {
  const a = apptId ? S.appointments.find(x => x.id === apptId) : null;
  openModal(`<h3>${a ? 'Remarcar compromisso' : 'Novo compromisso'}</h3><form id="apptForm">
  ${a ? `<div class="item" style="margin-bottom:10px">${esc(a.title)} — atual: ${dateBR(a.date)} ${a.time}</div>` : `
  <div class="field"><label>Título</label><input name="title" required placeholder="Reunião inicial"></div>
  <div class="field"><label>Cliente</label><select name="contactId"><option value="">—</option>${S.contacts.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
  <div class="field"><label>Demanda</label><select name="caseId"><option value="">—</option>${S.cases.filter(k => k.status === 'aberto').map(k => `<option value="${k.id}">${esc(k.title)}</option>`).join('')}</select></div>`}
  <div class="grid grid2"><div class="field"><label>Data</label><input name="date" type="date" required value="${addDays(today(), 1)}"></div>
  <div class="field"><label>Hora</label><select name="time" id="apptTime"></select></div></div>
  <div class="slotgrid" id="apptSlots"></div>
  <div class="row" style="margin-top:10px"><button class="btn primary">${a ? 'Remarcar' : 'Agendar'}</button><button type="button" class="btn" data-close>Cancelar</button></div></form>`);
  const form = $('apptForm');
  const refreshSlots = () => {
    const d = form.date.value;
    const slots = N.slotsForDate(d);
    $('apptSlots').innerHTML = slots.map(s => `<span class="slot ${s.taken ? 'taken' : ''}">${s.time}</span>`).join('') || '<span class="muted" style="font-size:11px">Sem expediente nesta data.</span>';
    $('apptTime').innerHTML = slots.filter(s => !s.taken).map(s => `<option>${s.time}</option>`).join('') || '<option value="">—</option>';
  };
  form.date.onchange = refreshSlots; refreshSlots();
  form.onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(form);
    try {
      if (a) await N.rescheduleAppointment(a.id, f.get('date'), f.get('time'), 'vilmar');
      else await N.createAppointment({ title: f.get('title'), contactId: f.get('contactId'), caseId: f.get('caseId'), date: f.get('date'), time: f.get('time') }, 'vilmar');
      closeModal(); N.render(); toast(a ? 'Remarcado' : 'Agendado');
    } catch (err) { toast(err.message); }
  };
}

/* ============================== TAREFAS ============================== */
N.views.tarefas = function renderTarefas() {
  const el = $('view-tarefas');
  const filter = S.taskFilter || 'abertas';
  let list = S.tasks.slice().sort((a, b) => (a.due || '').localeCompare(b.due || ''));
  if (filter === 'abertas') list = list.filter(t => t.status === 'aberta' && t.kind !== 'aprovacao');
  if (filter === 'aprovacoes') list = list.filter(t => t.kind === 'aprovacao' && t.status === 'aberta');
  if (filter === 'vencidas') list = list.filter(t => t.status === 'aberta' && daysDiff(t.due) < 0);
  if (filter === 'hoje') list = list.filter(t => t.status === 'aberta' && t.due === today());
  if (filter === 'concluidas') list = list.filter(t => t.status === 'concluida').reverse();
  const chips = [['abertas', 'Abertas'], ['hoje', 'Hoje'], ['vencidas', 'Vencidas'], ['aprovacoes', 'Aprovações IA'], ['concluidas', 'Concluídas']];
  el.innerHTML = `<div class="section-head"><div><div class="eyebrow">Central de tarefas e pendências</div><h2>Tarefas</h2></div>
    <button class="btn primary" data-action="new-task">+ Tarefa</button></div>
  <div class="chips">${chips.map(([k, l]) => `<button class="chip ${filter === k ? 'active' : ''}" data-action="task-filter" data-id="${k}">${l} (${k === 'abertas' ? S.tasks.filter(t => t.status === 'aberta' && t.kind !== 'aprovacao').length : k === 'aprovacoes' ? S.tasks.filter(t => t.kind === 'aprovacao' && t.status === 'aberta').length : k === 'vencidas' ? S.tasks.filter(t => t.status === 'aberta' && daysDiff(t.due) < 0).length : k === 'hoje' ? S.tasks.filter(t => t.status === 'aberta' && t.due === today()).length : S.tasks.filter(t => t.status === 'concluida').length})</button>`).join('')}</div>
  <div class="list">${list.slice(0, 60).map(t => {
    const c = N.contactById(t.contactId); const k = N.caseById(t.caseId);
    return `<div class="item ${t.status === 'aberta' && daysDiff(t.due) < 0 ? 'fatal' : ''}">

function contractModal() {
  if (!S.contacts.length) { toast('Cadastre um contato primeiro'); return; }

  <div class="field"><label>Cliente</label><select name="contactId" required>${S.contacts.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
  <div class="grid grid2"><div class="field"><label>Valor total</label><input name="total" type="number" step="100" required></div>
  <div class="field"><label>Parcelas</label><input name="parts" type="number" min="1" max="60" value="1"></div>
  <div class="field"><label>Entrada</label><input name="entry" type="number" step="100" value="0"></div>
  <div class="field"><label>% de êxito</label><input name="success" type="number" min="0" max="100" value="0"></div>
  <div class="field"><label>Primeiro vencimento</label><input name="firstDue" type="date" value="${addDays(today(), 30)}"></div>
  <div class="field"><label>Área</label><input name="area"></div></div>
  <div class="row"><button class="btn primary">Criar contrato</button><button type="button" class="btn" data-close>Cancelar</button></div></form>`);
  $('contractForm').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target); const c = N.contactById(f.get('contactId'));
    const total = Number(f.get('total') || 0), parts = Math.max(1, Number(f.get('parts') || 1)), entry = Number(f.get('entry') || 0);
    const rest = Math.max(0, total - entry), base = rest / parts;
    const contract = { id: uid(), contactId: c.id, clientId: c.id, client: c.name, total, entry, success: Number(f.get('success') || 0), area: f.get('area') || '', createdAt: now(), installments: [] };
    for (let i = 0; i < parts; i++) contract.installments.push({ id: uid(), value: +(i === parts - 1 ? rest - base * (parts - 1) : base).toFixed(2), dueDate: addDays(f.get('firstDue'), i * 30), status: 'pending' });
    S.contracts.push(contract);
    await N.persist('contracts'); closeModal(); toast('Contrato criado');
    N.emit('contract.signed', { contactId: c.id, kase: N.openCaseForContact(c.id) });
  };

async function sendAssistant(prefix) {
  const input = $('chatInput');
  const text = (prefix || input?.value || '').trim();
  if (!text) return;
  S.chat.push({ id: uid(), role: 'user', content: text, at: now() });
  await sset('chat', S.chat); N.views.assistente();
  const system = `Você é o Assistente VGJ LAW do escritório ${S.config.office}. Responda em português do Brasil, em até ~180 palavras. Use apenas os dados fornecidos. Nunca invente jurisprudência, processos, estatísticas ou fatos. Para textos ao cliente, entregue texto pronto para copiar. Observe o Provimento 205/2021 e não prometa resultado. Contexto real: ${JSON.stringify(N.aiContext())}`;
  try {
    const answer = (await N.aiMessages(system, [{ role: 'user', content: text }], 1000)) || 'Não foi possível obter resposta.';
    S.chat.push({ id: uid(), role: 'assistant', content: answer, at: now() });
  } catch (e) {
    S.chat.push({ id: uid(), role: 'assistant', content: 'Não foi possível consultar a IA agora: ' + (e?.message || 'erro') + ' A operação não foi perdida.', at: now() });
  }
  await sset('chat', S.chat); N.views.assistente();
}

  N.nav('assistente');
  $('chatInput').value = 'Analise esta publicação. Resuma em linguagem objetiva, identifique eventual prazo e sugira os campos para cadastro. Não cadastre automaticamente.\n\n' + t;
  $('chatInput').focus();
}

      <div class="muted" style="font-size:11px">${(f.questions || []).length} pergunta(s) · docs: ${esc((f.docs || []).join(', ') || '—')} · destino: ${esc(N.stageName(f.targetStage))}</div>
      <div class="muted" style="font-size:10px;margin-top:3px">Handoff: ${esc(f.handoff || '—')}</div></div>`).join('')}</div>`;

    body = `<div class="row" style="margin-bottom:10px"><button class="btn small primary" data-action="new-knowledge">+ Item</button></div>
    <div class="list">${S.knowledge.map(kb => `<div class="item"><div class="between"><strong>${esc(kb.title)}</strong><span class="row"><span class="badge">${esc(kb.category)}</span><button class="btn small" data-action="kb-edit" data-id="${kb.id}">Editar</button><button class="btn small danger" data-action="kb-del" data-id="${kb.id}">Excluir</button></span></div>

    ${N.TOOL_DEFS.map(t => `<tr><td title="${esc(t.description)}">${esc(t.name)}</td><td><select data-action="perm-set" data-id="${t.name}" class="btn small" style="font-weight:400">
      ${['allow', 'approve', 'block'].map(p => `<option value="${p}" ${N.iaCan(t.name) === p ? 'selected' : ''}>${{ allow: 'permitido', approve: 'exige aprovação', block: 'bloqueado' }[p]}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`;
  } else if (tab === 'auditoria') {
    body = `<div class="wa-note" style="margin-bottom:8px">Toda ação (IA, sistema, humano) fica registrada. ${S.auditLog.length} registro(s).</div>
    <div>${S.auditLog.slice(0, 80).map(a => `<div class="audit-row"><span class="when mono" style="color:#666">${dtBR(a.at)}</span><span class="who">${esc(a.actor)}</span><span>${esc(a.detail || a.action)}${a.result && a.result !== 'ok' ? ` <span class="badge bad">${esc(a.result)}</span>` : ''}</span></div>`).join('') || '<div class="empty">Sem registros.</div>'}</div>`;
  }
  el.innerHTML = `<div class="section-head"><div><div class="eyebrow">Motor do NAVE</div><h2>Sistema</h2></div></div>
  <div class="tabbar">${tabs.map(([k, l]) => `<button class="${tab === k ? 'active' : ''}" data-action="system-tab" data-id="${k}">${l}</button>`).join('')}</div>${body}`;
};

function copyText(sel) {
  const el = document.querySelector(sel); if (!el) return;
  (navigator.clipboard?.writeText(el.value || el.textContent || '') || Promise.reject()).then(() => toast('Copiado')).catch(() => { el.select?.(); document.execCommand('copy'); toast('Copiado'); });
}

<script>
/* NAVE — inicialização, navegação e delegação global de eventos */
(() => {
'use strict';
const N = window.NAVE, S = N.state;
const { $, esc, toast, openModal, closeModal, sset, uid, today } = N;

const NAV = [
  ['painel', '⌂', 'Painel'], ['inbox', '✉', 'Inbox'], ['funil', '◧', 'Funil'], ['clientes', '◎', 'Clientes'],
  ['agenda', '📅', 'Agenda'], ['tarefas', '☑', 'Tarefas'], ['juridico', '§', 'Jurídico'],
  ['financeiro', '¤', 'Financeiro'], ['assistente', '✦', 'Assistente'], ['sistema', '⚙', 'Sistema']];

function simulateModal() {
  openModal(`<h3>Simular mensagem recebida</h3>
  <p class="wa-note" style="margin-bottom:10px">Testa o fluxo completo (identificação → agente → CRM) sem depender da Zappfy.</p>
  <form id="simForm"><div class="grid grid2"><div class="field"><label>Telefone</label><input name="phone" required value="5577999990001"></div>
  <div class="field"><label>Nome (opcional)</label><input name="name" placeholder="Maria Silva"></div></div>
  <div class="field"><label>Mensagem</label><textarea name="text" required placeholder="Olá, meu plano negou o tratamento do meu filho..."></textarea></div>
  <div class="field"><label><input type="checkbox" name="asDoc"> Simular envio de documento (usa a mensagem como nome do arquivo)</label></div>
  <div class="row"><button class="btn primary">Receber</button><button type="button" class="btn" data-close>Cancelar</button></div></form>`);
  $('simForm').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    closeModal();
    const media = f.has('asDoc') ? { kind: 'document', filename: String(f.get('text')).slice(0, 60) } : null;
    await N.simulateInbound(f.get('phone'), f.get('text'), { name: f.get('name') || '', media });
    toast('Mensagem simulada recebida');
    N.nav('inbox');
  };
}

function docAddModal(caseId) {
  openModal(`<h3>Registrar documento recebido</h3><form id="docForm">
  <div class="field"><label>Nome do documento</label><input name="name" required placeholder="relatorio-medico.pdf"></div>
  <div class="field"><label>Categoria</label><select name="category"><option value="">(sugerir automaticamente)</option>${N.DOC_CATEGORIES.map(c => `<option>${c}</option>`).join('')}</select></div>
  <div class="field"><label>Arquivo (opcional, até 1,5 MB — fica salvo no VGJ LAW)</label><input name="file" type="file"></div>
  <div class="row"><button class="btn primary">Registrar</button><button type="button" class="btn" data-close>Cancelar</button></div></form>`);
  $('docForm').onsubmit = async e => {
    e.preventDefault();
    const form = e.target, f = new FormData(form);
    let fileData = null, fileType = '';
    const file = form.file.files[0];
    if (file) {
      if (file.size > 1.5 * 1024 * 1024) { toast('Arquivo acima de 1,5 MB — registre apenas os metadados.'); }
      else { fileData = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); }); fileType = file.type; }
    }
    const k = N.caseById(caseId);
    await N.registerDocument({ caseId, contactId: k?.contactId || '', name: file?.name || f.get('name'), category: f.get('category') || '', source: 'upload', fileData, fileType }, 'vilmar');
    closeModal(); N.caseDetail(caseId); toast('Documento registrado');
  };
}
function docRequestModal(caseId) {
  openModal(`<h3>Solicitar documento</h3><form id="docReqForm">
  <div class="field"><label>Documentos (um por linha)</label><textarea name="names" required placeholder="Relatório médico\nCarteirinha do plano"></textarea></div>
  <div class="field"><label><input type="checkbox" name="notify" checked> Enviar pedido ao cliente por WhatsApp</label></div>
  <div class="row"><button class="btn primary">Solicitar</button><button type="button" class="btn" data-close>Cancelar</button></div></form>`);
  $('docReqForm').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    const names = String(f.get('names')).split('\n').map(x => x.trim()).filter(Boolean);
    const docs = await N.requestDocuments(caseId, names, 'vilmar');
    if (f.has('notify') && docs.length) {
      const k = N.caseById(caseId), c = N.contactById(k?.contactId);
      if (c?.whatsapp || c?.phone) await N.waSend(c.whatsapp || c.phone, `Olá, ${c.name}. Para darmos andamento ao seu caso, precisamos de: ${docs.map(d => d.name).join(', ')}. Pode enviar por aqui mesmo?`, { silent: true, actor: 'vilmar' });
    }
    closeModal(); N.caseDetail(caseId); toast('Solicitação registrada');
  };
}
function caseLostModal(id) {
  openModal(`<h3>Marcar demanda como perdida</h3><form id="lostForm">
  <div class="field"><label>Motivo</label><select name="reason" required><option value="">Selecione</option><option>preço</option><option>demora</option><option>concorrente</option><option>sem perfil</option><option>desistência</option></select></div>
  <div class="field"><label>Aprendizado (1 linha)</label><input name="learning"></div>
  <div class="row"><button class="btn danger">Confirmar perda</button><button type="button" class="btn" data-close>Cancelar</button></form>`);
  $('lostForm').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    await N.updateCase(id, { status: 'perdido', lossReason: f.get('reason') }, 'vilmar');
    if (f.get('learning')) { S.learnings.push({ id: uid(), text: f.get('learning'), source: 'perda', createdAt: N.now() }); await sset('learnings', S.learnings); }
    closeModal(); N.render(); toast('Perda registrada');
  };
}

/* ---------- delegação de cliques ---------- */
document.addEventListener('click', async e => {
  const a = e.target.closest('[data-action]');
  const closeBtn = e.target.closest('[data-close]');
  const copyBtn = e.target.closest('[data-copy]');
  if (copyBtn) { N.copyText(copyBtn.dataset.copy); return; }
  if (closeBtn) { closeModal(); return; }
  if (!a) return;
  const act = a.dataset.action, id = a.dataset.id;
  try {
    switch (act) {
      /* navegação/gerais */
      case 'run-sweeps': await N.runSweeps(true); N.render(); toast('Rotinas executadas'); break;
      case 'system-tab': S.systemTab = id; N.render(); break;
      case 'inbox-filter': S.inboxFilter = id; N.render(); break;
      case 'task-filter': S.taskFilter = id; N.render(); break;
      case 'client-mode': S.clientMode = id; N.render(); break;
      /* inbox / chat */
      case 'inbox-select': S.waSelectedChatId = id; N.render(); break;
      case 'open-chat': S.waSelectedChatId = id; N.nav('inbox'); break;
      case 'open-chat-phone': {
        const p = N.normPhone(id);
        let chat = S.whatsappChats.find(c => N.normPhone(c.phone) === p);
        if (!chat) { toast('Sem conversa registrada com este número'); break; }
        S.waSelectedChatId = chat.id; closeModal(); N.nav('inbox'); break;
      }
      case 'inbox-send': {
        const ta = $('inboxText'); const text = ta?.value?.trim(); if (!text) break;
        const chat = N.chatById(id); if (!chat) break;
        ta.value = '';
        await N.waSend(chat.phone, text, { actor: 'vilmar' });
        break;
      }
      case 'chat-assume': await N.assumeChat(id); break;
      case 'chat-return-ia': await N.returnToAI(id); break;
      case 'chat-resolve': await N.resolveChat(id); break;
      case 'wa-sync-chats': N.waSyncChats(); break;
      case 'wa-status': N.waStatus(); break;
      case 'wa-mark-read': N.waMarkRead(id); break;
      case 'wa-setup': closeModal(); N.settingsModal(); break;
      case 'simulate-inbound': simulateModal(); break;
      /* contatos/empresas */
      case 'new-contact': N.contactEdit(null); break;
      case 'contact-edit': closeModal(); N.contactEdit(id); break;
      case 'contact-detail': closeModal(); N.contactDetail(id); break;
      case 'new-company': closeModal(); N.companyEdit(null); break;
      case 'company-edit': closeModal(); N.companyEdit(id); break;
      case 'company-detail': closeModal(); N.companyDetail(id); break;
      case 'link-company': closeModal(); N.linkCompanyModal(id); break;
      /* demandas */
      case 'new-case': N.caseEdit(null); break;
      case 'new-case-for': closeModal(); N.caseEdit(null, id); break;
      case 'case-edit': closeModal(); N.caseEdit(id); break;
      case 'case-detail': closeModal(); N.caseDetail(id); break;
      case 'case-advance': {
        const k = N.caseById(id); if (!k) break;
        const next = N.stages()[N.stageIndex(k.stageId) + 1];
        if (next) { await N.moveCase(id, next.id, 'vilmar'); N.render(); toast('Movida para ' + next.name); }
        break;
      }
      case 'case-move': {
        const sel = $('caseMoveSel'); if (!sel) break;
        await N.moveCase(id, sel.value, 'vilmar'); closeModal(); N.caseDetail(id); N.render(); break;
      }
      case 'case-lost': closeModal(); caseLostModal(id); break;
      case 'case-summary': {
        const txt = await N.generateCaseSummary(id, 'vilmar');
        openModal(`<h3>Resumo para Vilmar</h3><div class="summary-card">${esc(txt)}</div>
        <div class="field" style="margin-top:10px"><textarea id="copyText" style="display:none">${esc(txt)}</textarea></div>
        <div class="row" style="margin-top:10px"><button class="btn primary" data-copy="#copyText">Copiar</button><button class="btn" data-action="case-detail" data-id="${id}">Abrir demanda</button><button class="btn" data-close>Fechar</button></div>`);
        break;
      }
      case 'case-request-docs': {
        const k = N.caseById(id); const flow = k && N.flowByArea(k.area);
        if (flow?.docs?.length) { await N.requestDocuments(id, flow.docs, 'vilmar'); closeModal(); N.caseDetail(id); toast('Documentos da área solicitados'); }
        else toast('A área não tem documentos padrão — use "Solicitar documento".');
        break;
      }
      /* documentos */
      case 'doc-add': closeModal(); docAddModal(id); break;
      case 'doc-request-custom': closeModal(); docRequestModal(id); break;
      case 'doc-status': {
        await N.setDocStatus(id, a.dataset.status, 'vilmar'); N.render();
        const d = S.documents.find(x => x.id === id);
        if (d?.caseId && $('modal').innerHTML) { closeModal(); N.caseDetail(d.caseId); }
        break;
      }
      /* tarefas / aprovações */
      case 'new-task': N.taskModal(); break;
      case 'task-done': await N.completeTask(id, 'vilmar'); N.render(); toast('Tarefa concluída'); break;
      case 'approve-action': { const r = await N.approveAction(id); N.render(); toast('Ação aprovada e executada' + (r ? '' : '')); break; }
      case 'reject-action': await N.rejectAction(id); N.render(); toast('Ação rejeitada'); break;
      /* agenda */
      case 'new-appointment': N.appointmentModal(null); break;
      case 'appt-reschedule': N.appointmentModal(id); break;
      case 'appt-status': await N.setAppointmentStatus(id, a.dataset.status, 'vilmar'); N.render(); break;
      /* funil: estágios */
      case 'edit-stages': N.stagesEditor(); break;
      case 'stage-add': {
        const name = prompt('Nome do novo estágio:'); if (!name) break;
        const sid = name.trim().toLowerCase().replace(/\s+/g, '_').normalize('NFD').replace(/[^\w_]/g, '');
        if (N.stages().find(s => s.id === sid)) { toast('Já existe'); break; }
        S.pipeline.stages.push({ id: sid || uid(), name: name.trim() });
        await sset('pipeline', S.pipeline); N.stagesEditor(); N.render(); break;
      }
      case 'stage-rename': {
        const s = N.stages().find(x => x.id === id); if (!s) break;
        const name = prompt('Novo nome:', s.name); if (!name) break;
        s.name = name.trim(); await sset('pipeline', S.pipeline); N.stagesEditor(); N.render(); break;
      }
      case 'stage-del': {
        const inUse = S.cases.filter(k => k.stageId === id && k.status === 'aberto').length;
        if (inUse) { toast('Há ' + inUse + ' demanda(s) neste estágio — mova antes de excluir.'); break; }
        if (N.stages().length <= 2) { toast('O funil precisa de pelo menos 2 estágios.'); break; }
        S.pipeline.stages = S.pipeline.stages.filter(s => s.id !== id);
        await sset('pipeline', S.pipeline); N.stagesEditor(); N.render(); break;
      }
      case 'stage-up': {
        const i = N.stageIndex(id); if (i <= 0) break;
        const st = S.pipeline.stages;[st[i - 1], st[i]] = [st[i], st[i - 1]];
        await sset('pipeline', S.pipeline); N.stagesEditor(); N.render(); break;
      }
      /* jurídico / financeiro */
      case 'new-process': N.processModal(); break;
      case 'process-detail': N.processDetail(id); break;
      case 'end-process': closeModal(); N.endProcess(id); break;
      case 'client-summary': N.clientSummary(id); break;
      case 'new-deadline': N.deadlineModal(); break;
      case 'publication': N.publication(); break;
      case 'new-contract': N.contractModal(); break;
      case 'contract-detail': N.contractDetail(id); break;
      case 'charge': N.charge(id, a.dataset.installment); break;
      case 'pay': N.pay(id, a.dataset.installment); break;
      /* sistema */
      case 'new-automation': N.automationModal(null); break;
      case 'auto-edit': N.automationModal(id); break;
      case 'auto-del': S.automations = S.automations.filter(x => x.id !== id); await sset('automations', S.automations); N.render(); break;
      case 'new-flow': N.flowModal(null); break;
      case 'flow-edit': N.flowModal(id); break;
      case 'new-knowledge': N.knowledgeModal(null); break;
      case 'kb-edit': N.knowledgeModal(id); break;
      case 'kb-del': S.knowledge = S.knowledge.filter(x => x.id !== id); await sset('knowledge', S.knowledge); N.render(); break;
    }
  } catch (err) { console.error('ação ' + act, err); toast('Erro: ' + err.message); }
});

/* delegação de change (switches e selects) */
document.addEventListener('change', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  try {
    if (el.dataset.action === 'auto-toggle') {
      const auto = S.automations.find(x => x.id === el.dataset.id);
      if (auto) { auto.enabled = el.checked; await sset('automations', S.automations); await N.audit('vilmar', 'automation_toggle', `${auto.name}: ${auto.enabled ? 'ativada' : 'desativada'}`, {}); }
    } else if (el.dataset.action === 'perm-set') {
      S.config.iaPermissions[el.dataset.id] = el.value;
      await sset('config', S.config);
      await N.audit('vilmar', 'permission_change', `Permissão da IA ${el.dataset.id} → ${el.value}`, {});
    }
  } catch (err) { console.error(err); }
});

/* ---------- inicialização ---------- */
async function init() {
  const navEl = document.querySelector('.nav');
  navEl.innerHTML = NAV.map(([v, icon, label], i) => `<button data-view="${v}" class="${i === 0 ? 'active' : ''}"><b>${icon}</b>${label}</button>`).join('');
  navEl.querySelectorAll('button').forEach(b => b.onclick = () => N.nav(b.dataset.view));
  $('modalBackdrop').addEventListener('click', e => { if (e.target === $('modalBackdrop')) closeModal(); });
  $('settingsBtn').onclick = () => N.settingsModal();

  await N.loadState();
  N.ensurePipeline();
  await N.ensureFlows();
  await N.ensureKnowledge();
  await N.ensureAutomations();
  N.installEngine();
  if (N.getStorageMode() === 'memory') N.showStorageFallback();
  $('officeName').textContent = S.config.office || 'Escritório';
  N.nav('painel');
  N.startWaLoop();
  setTimeout(() => N.runSweeps().catch(console.error), 2500);
  N.emit('app.ready', {});
  window.__NAVE_READY = true;
}
init().catch(e => { console.error(e); N.showError('Falha na inicialização: ' + e.message); });
})();

</script>
</body>
</html>
