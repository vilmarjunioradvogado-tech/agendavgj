<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VGJ LAW — Sistema Operacional do Escritório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090a0c;--panel:#111318;--panel2:#171a20;--line:#292d35;--text:#f4f5f7;--muted:#9299a6;--accent:#d8ff4f;--danger:#ff6b6b;--warn:#ffd166;--ok:#67e8a5;--shadow:0 16px 50px rgba(0,0,0,.32)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}body{min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;padding-bottom:86px}
.top{position:sticky;top:0;z-index:20;background:rgba(9,10,12,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center}.brand-mark{width:30px;height:30px;border:1px solid var(--accent);display:grid;place-items:center;border-radius:9px;color:var(--accent);font-family:'DM Mono'}.brand h1{font:650 21px Fraunces;margin:0}
.sub{font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);width:38px;height:38px;border-radius:10px}
.banner{margin:12px 16px 0;padding:11px 13px;border:1px solid var(--warn);background:rgba(255,209,102,.08);color:#ffe7a3;border-radius:10px;font-size:12px;display:none}
.banner.error{border-color:var(--danger);background:rgba(255,107,107,.08);color:#ffb2b2}
.main{max-width:1280px;margin:auto;padding:16px}
.view{display:none}.view.active{display:block}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:8px 0 18px;flex-wrap:wrap}
.eyebrow{font:500 10px 'DM Mono';letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h2{font:650 28px Fraunces;margin:3px 0 0}
.grid{display:grid;gap:12px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:linear-gradient(180deg,var(--panel),#0e1014);border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--shadow)}
.metric{min-height:106px}.metric .num{font-size:28px;font-weight:800;margin-top:7px}.metric .label{color:var(--muted);font-size:12px}
.progress{height:8px;background:#252931;border-radius:99px;overflow:hidden;margin:12px 0 7px}.progress i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.status{font-size:11px;color:var(--muted)}.good{color:var(--ok)}.bad{color:var(--danger)}.warn{color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:9px;font-weight:700;font-size:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#101300}
.btn.danger{border-color:#73373b;color:#ffb2b2}
.btn.small{padding:7px 9px;font-size:11px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;gap:10px;align-items:center}
.muted{color:var(--muted)}.mono{font-family:'DM Mono';font-size:11px}
.list{display:grid;gap:8px}
.item{border:1px solid var(--line);background:#0e1014;border-radius:11px;padding:11px}
.item.fatal{border-color:#74353a;background:rgba(255,107,107,.06)}
.item.clickable{cursor:pointer}.item.clickable:hover{background:#14171d}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.empty strong{display:block;color:var(--text);margin-bottom:6px}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow:auto;padding-bottom:8px}
.lane{min-height:300px;background:#0d0f13;border:1px solid var(--line);border-radius:13px;padding:9px}
.lane h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:4px 4px 10px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.lead-card{padding:11px;border:1px solid var(--line);background:var(--panel);border-radius:10px;margin-bottom:8px}
.lead-card h4{margin:0 0 5px;font-size:13px}
.lead-card p{margin:3px 0;color:var(--muted);font-size:11px}
.badge{display:inline-flex;padding:3px 6px;border-radius:99px;border:1px solid var(--line);font-size:9px;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.badge.hot{color:#ffe39b;border-color:#6b5830}
.badge.good{color:var(--ok);border-color:#315c46}
.badge.bad{color:#ffb2b2;border-color:#73373b}
.badge.ia{color:#9fd4ff;border-color:#2e4b63}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal-backdrop.open{display:flex}
.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#0d0f13;border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px}
.modal h3{font:650 22px Fraunces;margin:0 0 14px}
.field{display:grid;gap:5px;margin-bottom:10px}
.field label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.field input,.field select,.field textarea{width:100%;background:#090b0e;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px;outline:none}
.field textarea{min-height:90px;resize:vertical}
.more{margin-top:8px;border-top:1px solid var(--line);padding-top:10px}
.more summary{font-size:11px;color:var(--muted);cursor:pointer;margin-bottom:10px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(12,13,16,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding:7px max(8px,env(safe-area-inset-left)) max(7px,env(safe-area-inset-bottom))}
.nav button{border:0;background:none;color:var(--muted);padding:7px 10px;font-size:10px;flex:1 0 auto;min-width:74px}
.nav button.active{color:var(--accent)}
.nav b{display:block;font-size:16px;margin-bottom:2px}
.nav button .ndot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--danger);margin-left:4px;vertical-align:top}
.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse;font-size:11px}
.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:9px 7px;white-space:nowrap}
.chat{display:flex;flex-direction:column;min-height:65vh}
.messages{display:grid;gap:10px;flex:1;margin-bottom:10px}
.bubble{max-width:92%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);white-space:pre-wrap;font-size:12px;line-height:1.45}
.bubble.user{justify-self:end;background:#1b2010;border-color:#3b4820}
.bubble.ai{justify-self:start;background:#101218}
.chips{display:flex;gap:7px;overflow:auto;padding:3px 0 9px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 9px;border-radius:99px;font-size:10px;cursor:pointer}
.chip.active{color:#101300;background:var(--accent);border-color:var(--accent)}
.composer{display:grid;grid-template-columns:1fr auto;gap:7px}
.composer textarea{background:#0c0e12;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:10px;min-height:48px}
.toast{position:fixed;right:14px;bottom:90px;background:#171a20;border:1px solid var(--line);padding:10px 12px;border-radius:10px;font-size:11px;z-index:80;display:none}
.toast.show{display:block}
.danger-zone{border-color:#4b2b2f}
.statline{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin:7px 0}
.pillbar{height:7px;background:#242831;border-radius:99px;display:flex;overflow:hidden}
.pillbar i{display:block;background:var(--accent)}
/* ---------- WhatsApp / Inbox ---------- */
.wa-dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#666}
.wa-dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(103,232,165,.08)}
.wa-dot.off{background:var(--danger)}
.wa-avatar{width:34px;height:34px;border-radius:10px;background:#171a20;border:1px solid var(--line);display:grid;place-items:center;font:500 12px 'DM Mono';color:var(--accent);flex:none}
.wa-note{font-size:10px;line-height:1.4;color:var(--muted)}
.inbox{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:560px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0b0d10}
.inbox-side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.inbox-search{padding:10px;border-bottom:1px solid var(--line)}
.inbox-search input{width:100%;background:#090b0e;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px}
.inbox-filters{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--line)}
.inbox-list{overflow:auto;flex:1}
.inbox-row{display:grid;grid-template-columns:auto 1fr auto;gap:9px;padding:11px;border:0;border-bottom:1px solid #1d2027;background:transparent;color:var(--text);width:100%;text-align:left;cursor:pointer}
.inbox-row:hover,.inbox-row.selected{background:#15181e}
.inbox-row .last{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inbox-row .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.inbox-row .unread{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:#101300;font-size:9px;font-weight:800;display:grid;place-items:center}
.inbox-main{display:flex;flex-direction:column;min-width:0}
.inbox-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.inbox-thread{flex:1;overflow:auto;padding:14px;display:grid;gap:8px;align-content:start;min-height:280px;max-height:430px}
.inbox-compose{padding:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px}
.inbox-compose textarea{width:100%;min-height:48px;max-height:120px;background:#090b0e;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px;resize:vertical}
.wa-bubble{padding:9px 10px;border:1px solid var(--line);border-radius:10px;max-width:88%;white-space:pre-wrap;font-size:11px;line-height:1.4}
.wa-bubble.in{justify-self:start;background:#101218}
.wa-bubble.out{justify-self:end;background:#1b2010;border-color:#3b4820}
.wa-bubble.sys{justify-self:center;background:#14161b;color:var(--muted);font-size:10px}
.wa-time{display:block;font:9px 'DM Mono';color:#666;margin-top:4px}
.wa-agentbar{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:#0e1014;border-radius:11px;padding:10px 12px;margin-bottom:10px}
/* ---------- Detalhe / abas ---------- */
.tabbar{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabbar button{border:0;background:none;color:var(--muted);padding:9px 11px;font-size:11px;font-weight:700;border-bottom:2px solid transparent}
.tabbar button.active{color:var(--accent);border-bottom-color:var(--accent)}
.timeline{display:grid;gap:6px}
.timeline .tl{display:grid;grid-template-columns:auto 1fr;gap:8px;font-size:11px;padding:7px 9px;border:1px solid #1d2027;border-radius:9px;background:#0d0f13}
.timeline .tl .when{color:#666;font:9px 'DM Mono';white-space:nowrap;padding-top:2px}
.doc-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border:1px solid var(--line);background:#0e1014;border-radius:10px;padding:9px 11px;font-size:12px}
.doc-row .cat{font-size:10px;color:var(--muted)}
.summary-card{border:1px solid #3b4820;background:rgba(216,255,79,.04);border-radius:12px;padding:13px;font-size:12px;line-height:1.55;white-space:pre-wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px}
.kv b{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.tagrow{display:flex;gap:5px;flex-wrap:wrap}
.slotgrid{display:flex;gap:6px;flex-wrap:wrap}
.slot{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 10px;border-radius:8px;font-size:11px}
.slot.taken{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.audit-row{display:grid;grid-template-columns:auto auto 1fr;gap:10px;font-size:11px;padding:7px 9px;border-bottom:1px solid #1d2027}
.audit-row .who{color:var(--accent);font-family:'DM Mono';font-size:10px}
.switch{position:relative;display:inline-block;width:34px;height:19px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:#2a2e36;border-radius:99px;transition:.15s}
.switch i:before{content:'';position:absolute;width:13px;height:13px;left:3px;top:3px;background:#888;border-radius:50%;transition:.15s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i:before{background:#101300;transform:translateX(15px)}
footer.credits{position:fixed;right:10px;bottom:77px;color:#555;font:9px 'DM Mono';pointer-events:none;max-width:46vw;text-align:right}
@media(max-width:900px){.inbox{grid-template-columns:1fr;min-height:0}.inbox-side{border-right:0;border-bottom:1px solid var(--line);max-height:300px}.grid4{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.grid3{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.main{padding:13px}h2{font-size:25px}.metric{min-height:96px}.top{padding:12px 13px}}
@media(max-width:440px){.grid3,.grid4{grid-template-columns:1fr 1fr}.card{padding:12px}.metric .num{font-size:24px}}

</style>

<div class="app" id="app">

</header>

<footer class="credits">O VGJ LAW opera o CRM com agente de IA enquanto estiver aberto. Atendimento 24/7 em segundo plano exige relay/backend público (webhook Zappfy) — o sistema não finge possuir esse serviço.</footer>
<script>
/* NAVE — núcleo: helpers, storage, estado, migração, eventos, auditoria, permissões */
(() => {
'use strict';
const NAVE = window.NAVE = window.NAVE || {};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const uid = () => (crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
const today = () => new Date().toISOString().slice(0, 10);
const now = () => new Date().toISOString();
const money = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(v) || 0);
const dateBR = v => v ? new Date(String(v).slice(0, 10) + 'T12:00:00').toLocaleDateString('pt-BR') : '—';
const dtBR = v => v ? new Date(v).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
const esc = v => String(v ?? '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
const daysDiff = (a, b = today()) => Math.floor((new Date(String(a).slice(0, 10) + 'T12:00:00') - new Date(String(b).slice(0, 10) + 'T12:00:00')) / 86400000);
const addDays = (d, n) => { const x = new Date(String(d).slice(0, 10) + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
const clone = x => JSON.parse(JSON.stringify(x));
const normPhone = p => String(p || '').replace(/\D/g, '');

/* ---------- storage: desktop (arquivo) -> localStorage -> memória ---------- */
const PREFIX = 'crm-';
const volatile = new Map();
const hasDesktopStore = !!(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function');
let storageMode = hasDesktopStore ? 'desktop' : (() => { try { const t = '__nave_test__'; localStorage.setItem(t, '1'); localStorage.removeItem(t); return 'local'; } catch (e) { return 'memory'; } })();

async function sget(k) {
  try {
    if (storageMode === 'desktop') { const r = await window.storage.get(PREFIX + k); if (r?.value != null) return JSON.parse(r.value); }
    else if (storageMode === 'local') { const v = localStorage.getItem(PREFIX + k); if (v != null) return JSON.parse(v); }
  } catch (e) { console.error('sget ' + k, e); }
  return volatile.has(k) ? clone(volatile.get(k)) : null;
}
async function sset(k, v) {
  const data = JSON.stringify(v);
  try {
    if (storageMode === 'desktop') { await window.storage.set(PREFIX + k, data); return; }
    if (storageMode === 'local') { localStorage.setItem(PREFIX + k, data); return; }
  } catch (e) { console.error('sset ' + k, e); storageMode = 'memory'; showStorageFallback(); }
  volatile.set(k, clone(v));
}
function showStorageFallback() {
  const b = $('storageBanner'); if (!b) return;
  b.style.display = 'block';
  b.textContent = 'Modo degradado: o armazenamento persistente não está disponível. Os dados ficam apenas na memória desta sessão.';
}

/* ---------- fetch (desktop = sem CORS via processo principal) ---------- */
async function apiFetch(url, opts) {
  if (window.naveDesktop && typeof window.naveDesktop.fetch === 'function') {
    const r = await window.naveDesktop.fetch(url, opts || {});
    return { ok: !!r.ok, status: r.status, json: async () => JSON.parse(r.body || 'null'), text: async () => r.body || '' };
  }
  return fetch(url, opts);
}

/* ---------- estado ---------- */
const KEYS = ['config', 'contacts', 'companies', 'cases', 'pipeline', 'documents', 'tasks', 'appointments',
  'automations', 'knowledge', 'triageFlows', 'auditLog', 'contracts', 'processes', 'deadlines', 'learnings',
  'chat', 'whatsappChats', 'whatsappMessages', 'waAgentLogs'];
const LIST_KEYS = KEYS.filter(k => !['config', 'pipeline'].includes(k));

const defaultConfig = {
  office: 'Vilmar Guimarães Júnior Advocacia', lawyer: 'Vilmar Guimarães Júnior', oab: '', goal: 30000, pix: '',
  anthropicApiKey: '', aiModel: 'claude-sonnet-4-6',
  users: [{ id: 'vilmar', name: 'Vilmar', role: 'administrador' }, { id: 'ia', name: 'Agente IA', role: 'agente_ia' }],
  roles: ['administrador', 'advogado', 'assistente', 'atendimento', 'agente_ia'],
  agenda: { startHour: 9, endHour: 18, slotMin: 60, weekdays: [1, 2, 3, 4, 5] },
  automations: { lead3: true, proposal5: true, installment3: true, hearing1: true },
  /* permissões do agente IA por ferramenta: allow | approve | block */
  iaPermissions: {
    find_contact: 'allow', create_contact: 'allow', update_contact: 'allow', create_case: 'allow', update_case: 'allow',
    move_pipeline: 'allow', create_task: 'allow', complete_task: 'approve', request_document: 'allow', register_document: 'allow',
    check_calendar: 'allow', create_appointment: 'allow', reschedule_appointment: 'approve', send_message: 'allow',
    handoff_to_human: 'allow', generate_case_summary: 'allow', search_knowledge: 'allow'
  },
  whatsapp: {
    enabled: true, baseUrl: 'https://api.zappfy.io', token: '', instanceId: '', phone: '', mode: 'autonomo',
    sendPath: '/send/text', webhookUrl: '', polling: true, pollMs: 30000, agentEnabled: true,
    agentName: 'Atendimento do Escritório', autoReply: true, createLead: true, createTasks: true, transferAfterTriage: true
  }
};

const state = NAVE.state = { waSelectedChatId: '', inboxFilter: 'todos', clientDetailId: '', systemTab: 'automacoes' };

async function loadState() {
  for (const k of KEYS) state[k] = await sget(k);
  state.config = deepMergeConfig(defaultConfig, state.config || {});
  for (const k of LIST_KEYS) if (!Array.isArray(state[k])) state[k] = [];
  if (!state.pipeline || !Array.isArray(state.pipeline.stages) || !state.pipeline.stages.length) state.pipeline = null; // data.js aplica default
  await migrate();
}
function deepMergeConfig(def, cur) {
  const out = { ...def, ...cur };
  out.automations = { ...def.automations, ...(cur.automations || {}) };
  out.whatsapp = { ...def.whatsapp, ...(cur.whatsapp || {}) };

async function migrate() {

  const oldClients = (await sget('clients')) || [];

      lastInteraction: c.createdAt || now(), nextAction: '', createdAt: c.createdAt || now(), updatedAt: now()
    });

    if (!contact) {
      contact = { id: uid(), name: l.name || 'Sem nome', phone: normPhone(l.phone), whatsapp: normPhone(l.phone), email: '', cpf: '',

        companyIds: [], lastInteraction: l.createdAt || now(), nextAction: '', createdAt: l.createdAt || now(), updatedAt: now() };
      state.contacts.push(contact);
    }

      id: uid(), migratedFromLead: l.id, title: l.subject || 'Demanda migrada', contactId: contact.id, companyId: '',
      area: l.subject || 'outras', subject: l.subject || '', origin: l.source || 'outro',
      stageId: stageMap[l.stage] || 'novo_contato', status: l.stage === 'PERDIDO' ? 'perdido' : (l.stage === 'FECHADO' ? 'ganho' : 'aberto'),
      priority: l.urgency === 'alta' ? 'alta' : 'normal', urgency: l.urgency || 'normal', ownerId: 'vilmar',
      value: Number(l.estimatedValue) || 0, createdAt: l.createdAt || now(), lastInteraction: l.createdAt || now(),
      nextAction: '', dueDate: '', notes: l.notes || '', summary: null, lossReason: l.lossReason || ''
    });
  }
  for (const t of state.tasks) { if (!t.status) t.status = t.done ? 'concluida' : 'aberta'; if (!t.assignee) t.assignee = 'vilmar'; }
  for (const ch of state.whatsappChats) { if (!ch.aiMode) ch.aiMode = 'ia'; }
  state.config.schemaVersion = 2;
  await sset('config', state.config);
  await Promise.all(['contacts', 'cases', 'tasks', 'whatsappChats'].map(k => sset(k, state[k])));
}

const listeners = {};
function on(evt, fn) { (listeners[evt] = listeners[evt] || []).push(fn); }

}

}

async function llm(payload) {
  if (typeof window.__NAVE_TEST_BRAIN === 'function') return await window.__NAVE_TEST_BRAIN(payload);
  const key = String(S.config.anthropicApiKey || '').trim();
  if (!key) throw new Error('Configure a chave da API Anthropic em Configurações (⚙) para usar a IA.');
  const body = { model: String(S.config.aiModel || 'claude-sonnet-4-6').trim() || 'claude-sonnet-4-6', max_tokens: payload.max_tokens || 1500,
    system: payload.system, messages: payload.messages };
  if (payload.tools) body.tools = payload.tools;
  const r = await apiFetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify(body)
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j?.error?.message || ('IA indisponível (' + r.status + ')'));
  return j;
}

  },

    ctx.contact = c;
    return 'Contato ' + c.name + ' (id ' + c.id + ') pronto.';

/* execução com validação + autorização + auditoria */
async function runTool(name, input, ctx) {
  const impl = IMPL[name];
  if (!impl) return 'Ferramenta desconhecida: ' + name;
  const perm = iaCan(name);
  if (ctx.actor === 'ia' && perm === 'block') {
    await audit('ia', name, 'BLOQUEADO pela política de permissões', { result: 'bloqueado', caseId: ctx.kase?.id || '', contactId: ctx.contact?.id || '' });
    return 'Ação bloqueada pela política do escritório. Encaminhe para Vilmar se necessário.';
  }
  if (ctx.actor === 'ia' && perm === 'approve') {
    await N.createTask({ title: `Aprovar ação da IA: ${name}`, desc: JSON.stringify(input), kind: 'aprovacao',
      payload: { tool: name, input, contactId: ctx.contact?.id || '', caseId: ctx.kase?.id || '', chatId: ctx.chat?.id || '' },
      priority: 'alta', contactId: ctx.contact?.id || '', caseId: ctx.kase?.id || '', origin: 'ia' }, 'ia');
    await audit('ia', name, 'Ação registrada para aprovação de Vilmar', { result: 'aguardando_aprovacao', caseId: ctx.kase?.id || '', contactId: ctx.contact?.id || '' });
    return 'Esta ação exige aprovação humana. Uma pendência foi criada para Vilmar; informe o cliente de que a equipe vai confirmar.';
  }
  try { return String(await impl(input || {}, ctx)); }
  catch (e) { await audit(ctx.actor || 'ia', name, 'ERRO: ' + e.message, { result: 'erro' }); return 'Erro ao executar ' + name + ': ' + e.message; }
}

/* aprovação humana de ações pendentes */
async function approveAction(taskId) {
  const t = S.tasks.find(x => x.id === taskId);
  if (!t || t.kind !== 'aprovacao' || !t.payload) return null;
  const ctx = { actor: 'vilmar', contact: N.contactById(t.payload.contactId), kase: N.caseById(t.payload.caseId),
    chat: S.whatsappChats.find(c => c.id === t.payload.chatId) || null, phone: '' };
  ctx.phone = ctx.contact?.whatsapp || ctx.contact?.phone || '';
  const result = await IMPL[t.payload.tool](t.payload.input || {}, ctx).catch(e => 'Erro: ' + e.message);
  await audit('vilmar', 'approve_action', `Aprovou ${t.payload.tool}: ${result}`, { caseId: t.caseId, contactId: t.contactId });
  await N.completeTask(taskId, 'vilmar');
  return result;
}
async function rejectAction(taskId) {
  const t = S.tasks.find(x => x.id === taskId);
  if (!t) return;
  await audit('vilmar', 'reject_action', 'Rejeitou ação da IA: ' + t.title, { caseId: t.caseId, contactId: t.contactId });
  await N.completeTask(taskId, 'vilmar');
}

/* ---------- resumo estruturado para Vilmar (determinístico — nunca inventa) ---------- */
async function generateCaseSummary(caseId, actor = 'sistema') {
  const k = N.caseById(caseId); if (!k) throw new Error('Demanda não encontrada');
  const c = N.contactById(k.contactId);
  const docs = N.caseDocs(caseId);
  const flow = N.flowByArea(k.area);
  const recebidos = docs.filter(d => ['recebido', 'aprovado'].includes(d.status)).map(d => `- ${d.name} (${d.category})`);
  const pendentes = docs.filter(d => d.status === 'pendente').map(d => `- ${d.name}`);
  const pontos = [];
  if (flow?.qualifyCriteria) pontos.push('- Critério de qualificação: ' + flow.qualifyCriteria);
  if (flow?.handoff) pontos.push('- Atenção: ' + flow.handoff);
  if (pendentes.length) pontos.push('- Documentos ainda pendentes (ver lista).');
  if (k.urgency === 'critica' || k.urgency === 'alta') pontos.push('- Urgência ' + k.urgency + ' — avaliar necessidade de medida imediata.');
  const answers = (k.triageAnswers || []).map(a => '- ' + a);
  const txt = [
    'CLIENTE: ' + (c ? c.name + (c.phone ? ' · ' + c.phone : '') : '—'),
    'DEMANDA: ' + k.title + ' (' + (flow?.label || k.area) + ')',
    'ORIGEM: ' + N.originLabel(k.origin),
    'ESTÁGIO: ' + N.stageName(k.stageId) + ' · URGÊNCIA: ' + (k.urgency || 'normal'),
    '',
    'TRIAGEM:', ...(answers.length ? answers : ['- (sem respostas registradas)']),
    k.subject ? '\nRELATO/ASSUNTO:\n' + k.subject : '',
    k.notes ? '\nOBSERVAÇÕES:\n' + k.notes : '',
    '',
    'DOCUMENTOS RECEBIDOS:', ...(recebidos.length ? recebidos : ['- nenhum']),
    'DOCUMENTOS PENDENTES:', ...(pendentes.length ? pendentes : ['- nenhum']),
    '',
    'PONTOS A VERIFICAR:', ...(pontos.length ? pontos : ['- análise geral do caso']),
    '',
    'PRÓXIMA AÇÃO: Análise jurídica por Vilmar.'
  ].filter(l => l !== '').join('\n');
  await N.updateCase(caseId, { summary: { text: txt, at: now() } }, actor);
  return txt;
}

IDENTIDADE: você é o atendimento institucional do escritório. Não use nome de pessoa (nunca "Julia"), não diga espontaneamente "sou uma inteligência artificial" e não finja ser um humano específico. Se perguntarem diretamente se é um robô, diga que é o canal automatizado de atendimento do escritório e que toda análise é feita pelo advogado.

MISSÃO: transformar cada conversa em ação concreta no CRM — identificar o cliente, entender a demanda, triar, qualificar, coletar informações e documentos, classificar, agendar quando autorizado, criar tarefas e preparar o caso para análise de Vilmar. Pergunte UMA coisa por vez. Português do Brasil, tom humano, acolhedor e profissional.

REGRAS RÍGIDAS (nunca viole):

- NUNCA informe honorários, prometa resultado, dê parecer jurídico definitivo ou feche acordo. Isso é decisão de Vilmar → use handoff_to_human.

FLUXO DE TRABALHO: 1) find_contact → create_contact se necessário; 2) entender a demanda → create_case (uma demanda POR ASSUNTO — cliente pode ter várias; não misture); 3) seguir as perguntas de triagem da área registrando cada resposta com update_case (triageAnswer); 4) request_document + pedir ao cliente; 5) registrar documentos recebidos; 6) mover no funil (move_pipeline) conforme progresso; 7) agendar com check_calendar/create_appointment quando o cliente pedir ou quando a triagem estiver completa; 8) ao concluir a triagem ou em situação de handoff: generate_case_summary + handoff_to_human.

BASE DE CONHECIMENTO (institucional — use search_knowledge para mais):
${kb}

COMUNICAÇÃO: toda fala com o cliente vai por send_message (curta, humana, sem revelar raciocínio interno nem nomes de ferramentas). Seu texto final (fora das ferramentas) é apenas nota interna de uma linha.`;

function contextSnapshot(ctx) {
  const msgs = S.whatsappMessages.filter(m => m.chatId === ctx.chat.id).slice(-20)
    .map(m => (m.direction === 'in' ? 'CLIENTE: ' : 'ESCRITÓRIO: ') + m.text).join('\n');
  const docs = ctx.kase ? N.caseDocs(ctx.kase.id).map(d => `${d.name} [${d.status}]`).join('; ') : '';
  const snap = {
    contato: ctx.contact ? { id: ctx.contact.id, nome: ctx.contact.name, telefone: ctx.contact.phone, status: ctx.contact.status, origem: ctx.contact.origin } : null,
    demanda_atual: ctx.kase ? { id: ctx.kase.id, titulo: ctx.kase.title, area: ctx.kase.area, estagio: ctx.kase.stageId, urgencia: ctx.kase.urgency, respostas_triagem: ctx.kase.triageAnswers || [], documentos: docs } : null,
    outras_demandas: ctx.contact ? N.contactCases(ctx.contact.id).filter(k => k.id !== ctx.kase?.id).map(k => ({ id: k.id, titulo: k.title, estagio: k.stageId, status: k.status })) : [],
    data_hoje: today()
  };
  return `CONTEXTO DO CRM (fonte da verdade — não invente além disto):\n${JSON.stringify(snap, null, 1)}\n\nCONVERSA RECENTE:\n${msgs}\n\nDecida e execute as próximas ações com as ferramentas. Depois responda ao cliente com send_message quando apropriado.`;
}

/* ---------- orquestrador por conversa ---------- */
const chatLocks = new Set();
async function runAgentOnChat(chat) {
  const w = S.config.whatsapp;
  if (!chat || chat.aiMode === 'humano' || chat.status === 'aguardando_vilmar') return null;
  if (w.agentEnabled === false || w.mode !== 'autonomo' || w.autoReply === false) return null;
  if (!aiConfigured() && typeof window.__NAVE_TEST_BRAIN !== 'function') return null;
  if (chatLocks.has(chat.id)) return null;
  chatLocks.add(chat.id);
  try {
    const phone = N.normPhone(chat.phone || chat.wa_chatid);
    const contact = chat.contactId ? N.contactById(chat.contactId) : N.findContact({ phone });
    let kase = chat.caseId ? N.caseById(chat.caseId) : (contact ? N.openCaseForContact(contact.id) : null);
    if (kase && kase.status !== 'aberto') kase = contact ? N.openCaseForContact(contact.id) : null;
    const lastIn = S.whatsappMessages.filter(m => m.chatId === chat.id && m.direction === 'in').slice(-1)[0];
    const ctx = { actor: 'ia', chat, contact, kase, phone, detectedFlow: lastIn ? N.detectArea(lastIn.text) : null, repliedInRun: false, handoff: false };
    const messages = [{ role: 'user', content: contextSnapshot(ctx) }];
    const tools = TOOL_DEFS;
    let finalText = '', iterations = 0, toolsUsed = [];
    while (iterations < 8) {
      iterations++;
      const resp = await llm({ system: agentSystem(ctx), messages, tools, max_tokens: 1500 });
      const content = resp.content || [];
      const toolBlocks = content.filter(b => b.type === 'tool_use');
      finalText = content.filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
      if (resp.stop_reason !== 'tool_use' || !toolBlocks.length) break;
      messages.push({ role: 'assistant', content });
      const results = [];
      for (const tb of toolBlocks) {
        // ctx pode ganhar contact/kase durante a execução — recarrega referências
        const out = await runTool(tb.name, tb.input, ctx);
        toolsUsed.push(tb.name);
        results.push({ type: 'tool_result', tool_use_id: tb.id, content: out });
        if (ctx.handoff) break;
      }
      messages.push({ role: 'user', content: results });
      if (ctx.handoff) {
        // dá uma última rodada para o agente se despedir do cliente
        const resp2 = await llm({ system: agentSystem(ctx), messages, tools, max_tokens: 700 });
        const c2 = resp2.content || [];
        for (const tb of c2.filter(b => b.type === 'tool_use' && b.name === 'send_message')) await runTool('send_message', tb.input, ctx);
        finalText = c2.filter(b => b.type === 'text').map(b => b.text).join('\n').trim() || finalText;
        break;
      }
    }
    // fallback: se o modelo respondeu só com texto e nunca falou com o cliente, envia o texto
    if (!ctx.repliedInRun && finalText && !ctx.handoff) await IMPL.send_message({ text: finalText }, ctx);
    chat.agentLastRun = now();
    if (ctx.kase) chat.caseId = ctx.kase.id;
    if (ctx.contact) chat.contactId = ctx.contact.id;
    if (lastIn) chat.agentLastProcessedId = lastIn.id;
    if (!ctx.handoff) chat.agentStatus = 'em_triagem';
    S.waAgentLogs.push({ id: uid(), chatId: chat.id, at: now(), tools: toolsUsed, note: finalText.slice(0, 300) });
    if (S.waAgentLogs.length > 300) S.waAgentLogs = S.waAgentLogs.slice(-300);
    await Promise.all([sset('whatsappChats', S.whatsappChats), sset('waAgentLogs', S.waAgentLogs)]);
    N.render();
    return { tools: toolsUsed, handoff: ctx.handoff };
  } catch (e) {
    console.error('agente', e);
    chat.agentStatus = 'erro_ia'; chat.agentLastError = e.message;
    S.waAgentLogs.push({ id: uid(), chatId: chat.id, at: now(), error: e.message });
    await Promise.all([sset('whatsappChats', S.whatsappChats), sset('waAgentLogs', S.waAgentLogs)]);
    return null;
  } finally { chatLocks.delete(chat.id); }
}

/* ---------- assistente interno (aba Assistente) ---------- */
async function aiMessages(system, messages, maxTokens = 1024) {
  const j = await llm({ system, messages, max_tokens: maxTokens });
  return (j.content || []).filter(b => b.type === 'text' || b.text).map(b => b.text || '').join('\n').trim();
}
function aiContext() {
  return {
    funil: N.stages().map(s => ({ estagio: s.name, demandas: S.cases.filter(k => k.stageId === s.id && k.status === 'aberto').length })),
    demandas_abertas: S.cases.filter(k => k.status === 'aberto').map(k => ({ titulo: k.title, cliente: N.contactById(k.contactId)?.name, estagio: N.stageName(k.stageId), urgencia: k.urgency })),
    contratos: S.contracts.map(c => ({ client: c.client, total: c.total, parcelas: (c.installments || []).length })),
    prazos: S.deadlines.map(d => ({ titulo: d.title, data: d.date, tipo: d.type })),
    tarefas_abertas: N.openTasks().length,
    reunioes: S.appointments.filter(a => a.date >= today() && a.status !== 'cancelado').map(a => ({ data: a.date, hora: a.time, titulo: a.title })),
  };
}

Object.assign(N, { aiConfigured, llm, TOOL_DEFS, toolImpl: IMPL, runTool, approveAction, rejectAction,
  generateCaseSummary, runAgentOnChat, aiMessages, aiContext, agentSystem });
})();

<script>
/* NAVE — WhatsApp (Zappfy): sincronização, entrada de mensagens, mídia/documentos, handoff, simulador */
(() => {
'use strict';
const N = window.NAVE, S = N.state;
const { uid, now, today, normPhone, emit, audit, sset, apiFetch, toast, openModal, closeModal, esc } = N;

const waConfig = () => S.config.whatsapp;
const offlineMode = () => window.__NAVE_TEST_MODE === true || !String(waConfig().token || '').trim();

function waIsGroup(c) {
  if (!c) return false;
  const ids = [c.wa_chatid, c.chatid, c.chatId, c.jid, c.remoteJid, c.id, c.phone, c.number].filter(Boolean).map(String);
  if (ids.some(v => /@g\.us(?:$|\?)/i.test(v))) return true;
  return c.isGroup === true || c.is_group === true || c.group === true || String(c.type || c.chatType || '').toLowerCase() === 'group';
}
const waChats = () => (Array.isArray(S.whatsappChats) ? S.whatsappChats : []).filter(c => !waIsGroup(c));
const waStatusLabel = () => { const w = waConfig(); return w.lastStatus === 'connected' ? 'Conectado' : w.lastStatus === 'disconnected' ? 'Desconectado' : w.lastStatus === 'error' ? 'Erro' : 'Não verificado'; };
const chatById = id => S.whatsappChats.find(c => c.id === id) || null;
const chatMessages = id => S.whatsappMessages.filter(m => m.chatId === id);

function ensureChatDefaults(c) {
  if (!c.aiMode) c.aiMode = 'ia';
  if (c.status === undefined) c.status = '';
  if (!c.agentStatus) c.agentStatus = 'novo';
  return c;
}

/* ---------- entrada de mensagens: identificação + documentos + eventos + agente ---------- */
function detectMedia(providerMsg) {
  const m = providerMsg || {};
  const t = String(m.type || m.messageType || m.mediaType || '').toLowerCase();
  const mime = String(m.mimetype || m.mimeType || '').toLowerCase();
  const filename = m.filename || m.fileName || m.documentName || m.caption || '';
  if (/audio|ptt|voice/.test(t) || mime.startsWith('audio')) return { kind: 'audio', filename };
  if (/document|file/.test(t) || /pdf|msword|officedocument/.test(mime)) return { kind: 'document', filename: filename || 'Documento recebido' };
  if (/image|photo/.test(t) || mime.startsWith('image')) return { kind: 'image', filename: filename || 'Imagem recebida' };
  return null;
}

async function processInbound(chat, msg) {
  ensureChatDefaults(chat);
  const phone = normPhone(chat.phone || chat.wa_chatid);
  /* identificação: localizar ou criar contato (dedupe por telefone) */
  let contact = chat.contactId ? N.contactById(chat.contactId) : N.findContact({ phone });
  if (!contact && phone) {
    contact = await N.createContact({ name: chat.name || chat.wa_contactName || phone, phone, origin: 'whatsapp', status: 'lead' }, 'sistema');
  }
  if (contact) { chat.contactId = contact.id; await N.touchContact(contact.id); }
  if (!chat.caseId && contact) { const k = N.openCaseForContact(contact.id); if (k) chat.caseId = k.id; }
  /* mídia: documentos/imagens entram no módulo documental; áudio fica marcado p/ transcrição */
  if (msg.media && (msg.media.kind === 'document' || msg.media.kind === 'image')) {
    const caseId = chat.caseId || (contact ? (N.openCaseForContact(contact.id)?.id || '') : '');
    await N.registerDocument({ caseId, contactId: contact?.id || '', name: msg.media.filename || 'Documento WhatsApp', source: 'whatsapp' }, 'sistema');
  }
  if (chat.status === 'aguardando_cliente') chat.status = '';
  chat.lastInboundAt = msg.at || now();
  await sset('whatsappChats', S.whatsappChats);
  await emit('message.inbound', { chat, msg, contact });
  return contact;
}

/* ---------- envio ---------- */
async function waSend(phone, text, opts = {}) {
  const w = waConfig();
  const p = normPhone(phone);
  if (!p) { if (!opts.silent) toast('Número de destino inválido.'); return false; }
  if (String(phone || '').includes('@g.us')) { if (!opts.silent) toast('Envio bloqueado: grupos do WhatsApp estão desativados.'); return false; }
  const target = S.whatsappChats.find(c => normPhone(c.phone) === p);
  if (waIsGroup(target)) { if (!opts.silent) toast('Envio bloqueado: o VGJ LAW não envia mensagens para grupos.'); return false; }
  let provider = null;
  if (!offlineMode()) {
    try {
      const url = (w.baseUrl || 'https://api.zappfy.io') + (w.sendPath || '/send/text');
      const r = await apiFetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', token: w.token },
        body: JSON.stringify({ number: p, text, readchat: true, readmessages: true }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.message || 'HTTP ' + r.status);
      provider = j;
    } catch (e) {
      await audit(opts.actor || 'vilmar', 'send_message', 'FALHA no envio para ' + p + ': ' + e.message, { result: 'erro' });
      if (!opts.silent) toast('Falha no envio: ' + e.message);
      return false;
    }
  } else if (!window.__NAVE_TEST_MODE && !String(w.token || '').trim() && !opts.silent) {
    toast('Zappfy não configurada — mensagem registrada apenas localmente.');
  }
  let chat = S.whatsappChats.find(c => normPhone(c.phone) === p);
  if (!chat) { chat = ensureChatDefaults({ id: uid(), phone: p, name: p, wa_lastMessageText: '', agentPending: [] }); S.whatsappChats.push(chat); }
  S.whatsappMessages.push({ id: uid(), chatId: chat.id, direction: 'out', phone: p, text, at: now(), provider, actor: opts.actor || 'vilmar' });
  chat.wa_lastMessageText = text;
  await Promise.all([sset('whatsappChats', S.whatsappChats), sset('whatsappMessages', S.whatsappMessages)]);
  await audit(opts.actor || 'vilmar', 'send_message', 'WhatsApp → ' + p + ': ' + String(text).slice(0, 120), {});
  if (!opts.silent) { N.render(); toast('Mensagem enviada'); }
  return true;
}

/* ---------- sincronização Zappfy ---------- */
async function waSyncChats(silent = false) {
  const w = waConfig();
  if (!w.token) { if (!silent) toast('Configure o token Zappfy primeiro'); return false; }
  try {
    const r = await apiFetch((w.baseUrl || 'https://api.zappfy.io') + '/chat/find', { method: 'POST',
      headers: { 'Content-Type': 'application/json', token: w.token },
      body: JSON.stringify({ operator: 'AND', sort: '-wa_lastMsgTimestamp', limit: 200, offset: 0 }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || j.message || 'HTTP ' + r.status);
    const raw = Array.isArray(j.chats) ? j.chats : (Array.isArray(j.data) ? j.data : (Array.isArray(j.results) ? j.results : (Array.isArray(j.items) ? j.items : [])));
    const incoming = raw.filter(x => !waIsGroup(x));
    const oldByPhone = new Map(S.whatsappChats.map(c => [normPhone(c.phone || c.wa_chatid), c]));
    const needLoad = new Set();
    S.whatsappChats = incoming.map(x => {
      const phone = normPhone(x.phone || x.wa_chatid);
      const old = oldByPhone.get(phone) || {};
      const merged = ensureChatDefaults({ ...old, ...x, id: String(old.id || x.id || x.wa_chatid || phone || uid()), phone,
        name: x.name || x.wa_contactName || x.wa_name || x.lead_name || old.name || phone || 'Sem nome',
        wa_lastMessageText: x.wa_lastMessageText || old.wa_lastMessageText || '',
        contactId: old.contactId || '', caseId: old.caseId || '', aiMode: old.aiMode || 'ia', status: old.status || '',
        agentStatus: old.agentStatus || 'novo', agentLastProcessedId: old.agentLastProcessedId || '',
        agentSummary: old.agentSummary || '', agentUrgency: old.agentUrgency || '', agentPending: old.agentPending || [], agentLastRun: old.agentLastRun || '' });
      const hasMsgs = S.whatsappMessages.some(m => m.chatId === merged.id);
      if (!hasMsgs || String(x.wa_lastMsgTimestamp || '') !== String(old.wa_lastMsgTimestamp || '')) needLoad.add(merged.id);
      return merged;
    });
    if (!S.waSelectedChatId && S.whatsappChats[0]) S.waSelectedChatId = S.whatsappChats[0].id;
    if (S.waSelectedChatId) needLoad.add(S.waSelectedChatId);
    await sset('whatsappChats', S.whatsappChats);
    const toLoad = S.whatsappChats.filter(c => needLoad.has(c.id)).slice(0, silent ? 20 : 40);
    for (const c of toLoad) await waLoadMessages(c, silent);
    await sset('whatsappChats', S.whatsappChats);
    N.render();
    if (!silent) toast(`${S.whatsappChats.length} conversa(s) sincronizada(s)`);
    return true;
  } catch (e) {
    if (silent) console.error('waSyncChats', e); else toast('Falha ao sincronizar conversas: ' + e.message);
    return false;
  }
}

async function waLoadMessages(c, silent = false) {
  const w = waConfig();
  if (waIsGroup(c) || !w.token || !c) return false;
  const number = normPhone(c.phone || c.wa_chatid);
  if (!number) return false;
  try {
    const r = await apiFetch((w.baseUrl || 'https://api.zappfy.io') + '/message/find', { method: 'POST',
      headers: { 'Content-Type': 'application/json', token: w.token },
      body: JSON.stringify({ chatid: String(c.wa_chatid || number + '@s.whatsapp.net'), limit: 100, offset: 0 }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || j.message || 'HTTP ' + r.status);
    const incoming = Array.isArray(j.messages) ? j.messages : Array.isArray(j.data) ? j.data : [];
    const prevIds = new Set(S.whatsappMessages.filter(m => m.chatId === c.id).map(m => m.id));
    const keep = S.whatsappMessages.filter(m => m.chatId !== c.id || !m.provider === false); // mantém locais (sem provider) e de outras conversas
    const keepLocal = S.whatsappMessages.filter(m => m.chatId === c.id && !m.provider && m.direction === 'out');
    const others = S.whatsappMessages.filter(m => m.chatId !== c.id);
    const mapped = incoming.map(m => {
      const media = detectMedia(m);
      let text = m.text || m.body || m.message || m.content || m.caption || '';
      if (media?.kind === 'audio' && !text) text = '[Áudio recebido — transcrição automática indisponível; configure um serviço de STT ou peça para o cliente escrever]';
      if ((media?.kind === 'document' || media?.kind === 'image') && !text) text = '[' + (media.filename || 'Arquivo recebido') + ']';
      return { id: String(m.id || m.messageid || uid()), chatId: c.id, phone: number,
        direction: (m.fromMe || m.direction === 'out' || m.messageType === 'outgoing') ? 'out' : 'in',
        text, media, at: m.timestamp ? new Date(Number(m.timestamp) > 1e12 ? Number(m.timestamp) : Number(m.timestamp) * 1000).toISOString() : m.created || now(), provider: m };
    }).filter(m => m.text);
    S.whatsappMessages = others.concat(keepLocal, mapped).slice(-5000);
    await sset('whatsappMessages', S.whatsappMessages);
    const fresh = mapped.filter(m => m.direction === 'in' && !prevIds.has(m.id));
    for (const msg of fresh) await processInbound(c, msg);
    if (fresh.length && waConfig().agentEnabled !== false) N.runAgentOnChat(c);
    return true;
  } catch (e) {
    if (silent) console.error('waLoadMessages', e); else toast('Não foi possível carregar as mensagens: ' + e.message);
    return false;
  }
}

async function waStatus(showResult = true) {
  const w = waConfig();
  if (!w.token) { openModal(`<h3>Configurar Zappfy</h3><p class="muted" style="font-size:12px">Informe o token da instância em Configurações → WhatsApp.</p><button class="btn primary" data-action="wa-setup">Configurar agora</button>`); return null; }
  try {
    const r = await apiFetch((w.baseUrl || 'https://api.zappfy.io') + '/instance/status', { headers: { token: w.token } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.message || j.error || 'HTTP ' + r.status);
    const inst = j?.instance || {}; const st = j?.status || {};
    w.lastStatus = String(inst.status || '').toLowerCase() || ((st.connected || st.loggedIn) ? 'connected' : 'disconnected');
    w.profileName = inst.profileName || w.profileName || '';
    w.phone = st?.jid?.user || w.phone || '';
    w.lastCheck = now(); w.qrcode = inst.qrcode || ''; w.paircode = inst.paircode || ''; w.lastError = '';
    await sset('config', S.config);
    N.render();
    if (showResult) waShowSyncResult(j);
    toast('Zappfy: ' + waStatusLabel());
    return j;
  } catch (e) {
    w.lastStatus = 'error'; w.lastError = e.message; w.qrcode = '';
    await sset('config', S.config); N.render();
    toast('Falha ao consultar Zappfy: ' + e.message);
    return null;
  }
}
function waShowSyncResult(j) {
  const w = waConfig(), inst = j?.instance || {}, st = j?.status || {}, status = String(inst.status || '').toLowerCase();
  let html = '';
  if (status === 'connected' || st.connected || st.loggedIn) {
    html = `<h3>WhatsApp conectado</h3><div class="item"><strong>${esc(inst.profileName || w.profileName || 'WhatsApp')}</strong><div class="wa-note">${esc(String(st?.jid?.user || w.phone || ''))} · conectado à Zappfy</div></div>`;
  } else if (inst.qrcode) {
    html = `<h3>Conectar WhatsApp</h3><p class="wa-note">WhatsApp → Configurações → Aparelhos conectados → Conectar aparelho</p><div style="text-align:center"><img src="${esc(inst.qrcode)}" alt="QR Code" style="width:min(300px,80vw);background:#fff;padding:10px;border-radius:12px"></div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn small" data-action="wa-status">Atualizar QR Code</button></div>`;
  } else if (inst.paircode) {
    html = `<h3>Código de pareamento</h3><div style="font:700 24px 'DM Mono';margin:8px 0">${esc(inst.paircode)}</div><button class="btn small" data-action="wa-status">Atualizar</button>`;
  } else {
    html = `<h3>Sincronização</h3><p class="wa-note">Instância: ${esc(status || 'desconhecida')}. Se estiver desconectada, inicie a conexão no painel da Zappfy e tente novamente.</p><button class="btn small" data-action="wa-status">Atualizar</button>`;
  }
  openModal(html + '<div class="row" style="margin-top:12px"><button class="btn" data-close>Fechar</button></div>');
}

async function waMarkRead(id) {
  const w = waConfig(), c = chatById(id);
  if (!w.token || !c) return;
  const ids = chatMessages(id).filter(m => m.direction === 'in' && (m.provider?.messageid || m.provider?.id || m.id)).slice(-50).map(m => m.provider?.messageid || m.provider?.id || m.id);
  if (!ids.length) { toast('Nenhuma mensagem recebida para marcar como lida'); return; }
  try {
    const r = await apiFetch((w.baseUrl || 'https://api.zappfy.io') + '/message/markread', { method: 'POST', headers: { 'Content-Type': 'application/json', token: w.token }, body: JSON.stringify({ id: ids }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    c.wa_unreadCount = 0;
    await sset('whatsappChats', S.whatsappChats);
    N.render(); toast('Mensagens marcadas como lidas');
  } catch (e) { toast('Não foi possível marcar como lida: ' + e.message); }
}

/* ---------- handoff IA <-> humano ---------- */
async function assumeChat(chatId) {
  const c = chatById(chatId); if (!c) return;
  c.aiMode = 'humano'; c.status = 'com_vilmar';
  await sset('whatsappChats', S.whatsappChats);
  await audit('vilmar', 'assume_chat', 'Vilmar assumiu a conversa de ' + (c.name || c.phone), { contactId: c.contactId });
  N.render();
}
async function returnToAI(chatId) {
  const c = chatById(chatId); if (!c) return;
  c.aiMode = 'ia'; c.status = ''; c.agentStatus = 'em_triagem';
  await sset('whatsappChats', S.whatsappChats);
  await audit('vilmar', 'return_to_ai', 'Conversa devolvida à IA: ' + (c.name || c.phone), { contactId: c.contactId });
  N.render();
}
async function resolveChat(chatId) {
  const c = chatById(chatId); if (!c) return;
  c.status = ''; c.agentStatus = 'encerrado';
  await sset('whatsappChats', S.whatsappChats);
  await audit('vilmar', 'resolve_chat', 'Conversa resolvida: ' + (c.name || c.phone), { contactId: c.contactId });
  N.render();
}

/* ---------- simulador (testes E2E / demonstração sem Zappfy) ---------- */
async function simulateInbound(phone, text, opts = {}) {
  const p = normPhone(phone);
  let chat = S.whatsappChats.find(c => normPhone(c.phone) === p);
  if (!chat) { chat = ensureChatDefaults({ id: uid(), phone: p, name: opts.name || p, wa_lastMessageText: '', agentPending: [] }); S.whatsappChats.push(chat); }
  else if (opts.name && (!chat.name || chat.name === p)) chat.name = opts.name;
  const msg = { id: uid(), chatId: chat.id, phone: p, direction: 'in', text: String(text),
    media: opts.media || null, at: now(), provider: opts.provider || { simulated: true } };
  S.whatsappMessages.push(msg);
  chat.wa_lastMessageText = msg.text;
  chat.wa_lastMsgTimestamp = Date.now();
  await Promise.all([sset('whatsappChats', S.whatsappChats), sset('whatsappMessages', S.whatsappMessages)]);
  await processInbound(chat, msg);
  let agentResult = null;
  if (!opts.skipAgent) agentResult = await N.runAgentOnChat(chat);
  N.render();
  return { chat, msg, agentResult };
}

/* ---------- loop de fundo ---------- */
function startWaLoop() {
  if (window.__naveWaLoop) clearInterval(window.__naveWaLoop);
  const w = waConfig();
  if (w.agentEnabled !== false && w.polling !== false && String(w.token || '').trim()) {
    window.__naveWaLoop = setInterval(async () => {
      try { await waSyncChats(true); await N.runSweeps(); } catch (e) { console.error(e); }
    }, Math.max(15000, Number(w.pollMs || 30000)));
  }
}

Object.assign(N, { waConfig, waIsGroup, waChats, waStatusLabel, chatById, chatMessages, processInbound, waSend,
  waSyncChats, waLoadMessages, waStatus, waMarkRead, assumeChat, returnToAI, resolveChat, simulateInbound, startWaLoop, offlineMode });
})();

<script>
/* NAVE — telas: Painel operacional, Inbox unificada, Funil, Clientes (PF/PJ) */
(() => {
'use strict';
const N = window.NAVE, S = N.state;
const { $, esc, money, dateBR, dtBR, today, daysDiff, addDays, openModal, closeModal, toast, stageName } = N;

const urgBadge = u => `<span class="badge ${u === 'alta' || u === 'critica' ? 'hot' : ''}">${esc(u || 'normal')}</span>`;

/* ============================== PAINEL ============================== */
N.views.painel = function renderPainel() {
  const el = $('view-painel');
  const openCases = S.cases.filter(k => k.status === 'aberto');
  const newContacts7 = S.contacts.filter(c => daysDiff(today(), c.createdAt?.slice(0, 10) || today()) <= 7).length;
  const triagem = openCases.filter(k => ['novo_contato', 'triagem'].includes(k.stageId)).length;
  const qualificados = openCases.filter(k => k.stageId === 'qualificado').length;
  const aguardDocs = openCases.filter(k => k.stageId === 'aguardando_documentos').length;
  const analise = openCases.filter(k => ['documentacao_completa', 'analise_juridica'].includes(k.stageId)).length;
  const handoffs = N.waChats().filter(c => c.status === 'aguardando_vilmar');
  const approvals = S.tasks.filter(t => t.status === 'aberta' && t.kind === 'aprovacao');
  const meetsToday = S.appointments.filter(a => a.date === today() && a.status !== 'cancelado');
  const tasksOpen = N.openTasks().filter(t => t.kind !== 'aprovacao');
  const overdue = tasksOpen.filter(t => daysDiff(t.due) < 0);
  const dueToday = tasksOpen.filter(t => t.due === today());
  const docsPend = S.documents.filter(d => d.status === 'pendente').length;
  const contratos = openCases.filter(k => ['contratacao', 'execucao', 'acompanhamento'].includes(k.stageId)).length;
  const deadlines = S.deadlines.filter(d => daysDiff(d.date) >= 0 && daysDiff(d.date) <= 7);

  /* conversão por origem: leads -> qualificados+ -> reuniões -> contratos */
  const qualIdx = N.stageIndex('qualificado'), contrIdx = N.stageIndex('contratacao');
  const byOrigin = {};
  for (const k of S.cases) {
    const o = k.origin || 'outro';
    const b = byOrigin[o] = byOrigin[o] || { leads: 0, qualificados: 0, reunioes: 0, contratos: 0 };
    b.leads++;
    if (N.stageIndex(k.stageId) >= qualIdx || k.status === 'ganho') b.qualificados++;
    if (S.appointments.some(a => a.caseId === k.id)) b.reunioes++;
    if (N.stageIndex(k.stageId) >= contrIdx || k.status === 'ganho') b.contratos++;
  }

  const attention = [];
  for (const t of approvals) attention.push({ pri: 0, html: `<div class="item fatal"><div class="between"><strong>⚖ Aprovação: ${esc(t.title.replace('Aprovar ação da IA: ', ''))}</strong>${urgBadge('alta')}</div><div class="muted" style="font-size:11px">${esc((t.desc || '').slice(0, 120))}</div><div class="row" style="margin-top:7px"><button class="btn small primary" data-action="approve-action" data-id="${t.id}">Aprovar</button><button class="btn small danger" data-action="reject-action" data-id="${t.id}">Rejeitar</button></div></div>` });

  for (const a of meetsToday) attention.push({ pri: 3, html: `<div class="item"><div class="between"><strong>📅 ${a.time} — ${esc(a.title)}</strong><span class="badge">${esc(a.status)}</span></div></div>` });

  attention.sort((a, b) => a.pri - b.pri);

  el.innerHTML = `<div class="section-head"><div><div class="eyebrow">Visão operacional</div><h2>O que precisa da sua atenção agora?</h2></div><div class="row"><button class="btn" data-action="run-sweeps">Executar rotinas</button><button class="btn primary" data-action="new-case">+ Demanda</button></div></div>
  <div class="grid grid4">
    <div class="card metric"><div class="label">Novos contatos (7d)</div><div class="num">${newContacts7}</div><div class="status">${S.contacts.length} no total</div></div>
    <div class="card metric"><div class="label">Em triagem</div><div class="num">${triagem}</div><div class="status">${qualificados} qualificados</div></div>
    <div class="card metric"><div class="label">Aguardando documentos</div><div class="num">${aguardDocs}</div><div class="status">${docsPend} documento(s) pendente(s)</div></div>
    <div class="card metric"><div class="label">Aguardando Vilmar</div><div class="num ${handoffs.length + approvals.length ? 'bad' : ''}">${handoffs.length + approvals.length}</div><div class="status">${approvals.length} aprovação(ões) · ${analise} em análise</div></div>
    <div class="card metric"><div class="label">Reuniões hoje</div><div class="num">${meetsToday.length}</div><div class="status">${S.appointments.filter(a => a.date > today() && a.status !== 'cancelado').length} futuras</div></div>
    <div class="card metric"><div class="label">Tarefas vencidas</div><div class="num ${overdue.length ? 'bad' : ''}">${overdue.length}</div><div class="status">${dueToday.length} para hoje</div></div>
    <div class="card metric"><div class="label">Casos em andamento</div><div class="num">${contratos}</div><div class="status">${S.cases.filter(k => k.status === 'ganho').length} concluídos</div></div>
    <div class="card metric"><div class="label">Conversão</div><div class="num">${S.cases.length ? Math.round(100 * S.cases.filter(k => N.stageIndex(k.stageId) >= contrIdx || k.status === 'ganho').length / S.cases.length) : 0}%</div><div class="status">demanda → contratação</div></div>
  </div>
  <div class="grid grid2" style="margin-top:12px">

const FILTERS = [
  ['todos', 'Todos'], ['ia', 'IA atendendo'], ['humano', 'Aguardando humano'], ['urgente', 'Urgente'],
  ['novos', 'Novos'], ['sem_resposta', 'Sem resposta'], ['pendentes', 'Pendentes'], ['meus', 'Meus atendimentos']];

function chatCase(c) { return c.caseId ? N.caseById(c.caseId) : (c.contactId ? N.openCaseForContact(c.contactId) : null); }
function filterChats(list, f) {
  const lastMsg = id => N.chatMessages(id).slice(-1)[0];
  switch (f) {
    case 'ia': return list.filter(c => c.aiMode !== 'humano' && c.status !== 'aguardando_vilmar');
    case 'humano': return list.filter(c => c.status === 'aguardando_vilmar');
    case 'urgente': return list.filter(c => ['alta', 'critica'].includes(c.agentUrgency) || ['alta', 'critica'].includes(chatCase(c)?.urgency));
    case 'novos': return list.filter(c => c.agentStatus === 'novo' || !c.contactId);
    case 'sem_resposta': return list.filter(c => { const m = lastMsg(c.id); return m && m.direction === 'out' && (Date.now() - new Date(m.at)) > 86400000; });
    case 'pendentes': return list.filter(c => N.openTasks().some(t => t.contactId === c.contactId) || N.caseDocs(chatCase(c)?.id || '').some(d => d.status === 'pendente'));
    case 'meus': return list.filter(c => c.aiMode === 'humano' || c.status === 'com_vilmar');
    default: return list;
  }
}
