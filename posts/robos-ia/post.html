<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Post — Eu e a minha equipe de IA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #222; font-family: "Liberation Sans", Helvetica, Arial, sans-serif; }

  /* ---------- moldura do post ---------- */
  #post {
    width: 1080px; height: 1350px;      /* feed 4:5 — trocar por 1080x1920 no story */
    background: #fff;
    position: relative; overflow: hidden;
  }
  body.story #post { height: 1920px; }
  body.story .scene { height: 1160px; }
  body.story .card { padding: 120px 52px 30px; }
  body.story .quote { font-size: 52px; }
  body.story .who .name { font-size: 46px; }
  body.story .who .handle { font-size: 38px; }
  body.story .row { transform: scale(1.02); transform-origin: bottom left; }

  /* ---------- cabeçalho estilo print de tweet ---------- */
  .card { padding: 46px 52px 30px; }
  .who { display: flex; align-items: center; gap: 22px; margin-bottom: 30px; }
  .who .pic {
    width: 92px; height: 92px; border-radius: 50%; overflow: hidden;
    background: #111; flex: none;
  }
  .who .pic img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 24%; }
  .who .name { font-size: 40px; font-weight: 700; color: #14171a; letter-spacing: -.4px; }
  .who .handle { font-size: 34px; color: #8899a6; margin-top: 4px; }

  .quote { font-size: 45px; line-height: 1.34; color: #14171a; font-weight: 700; letter-spacing: -.5px; }
  .quote span { display: block; }
  .quote .cliente { margin-bottom: 22px; }

  /* ---------- cena ---------- */
  .scene {
    position: absolute; left: 0; right: 0; bottom: 0; height: 830px;
    background:
      radial-gradient(46% 40% at 84% 10%, rgba(45,215,120,.16), transparent 70%),
      radial-gradient(42% 34% at 6% 20%, rgba(255,205,140,.14), transparent 72%),
      radial-gradient(110% 100% at 50% 118%, #22252a, #0b0c0f 68%);
    overflow: hidden;
  }
  .scene::after {                                  /* vinheta */
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(78% 68% at 46% 44%, transparent 42%, rgba(0,0,0,.6));
  }
  .floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 156px;
    background: linear-gradient(#0a0b0d, #14161a);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
  }

  .row {
    position: absolute; inset: 0;
    display: flex; align-items: flex-end; padding-bottom: 156px;
  }

  /* eu (foto real) */
  .human { position: relative; width: 380px; height: 664px; flex: none; margin-left: -14px; }
  .human img {
    width: 100%; height: 100%; object-fit: cover; object-position: 54% 21%;
    -webkit-mask-image: linear-gradient(to right, #000 70%, transparent 100%),
                        linear-gradient(to bottom, transparent 0%, #000 14%, #000 90%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to right, #000 70%, transparent 100%),
                linear-gradient(to bottom, transparent 0%, #000 14%, #000 90%, transparent 100%);
    mask-composite: intersect;
  }

  /* robôs */
  .bots { display: flex; align-items: flex-end; }
  .bot { position: relative; }
  .bot svg { display: block; filter: drop-shadow(0 26px 34px rgba(0,0,0,.6)); }
  .bot::before {                                   /* sombra de contato no chão */
    content: ""; position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
    width: 210px; height: 34px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,.75), transparent 78%);
  }

  /* etiquetas */
  .tag {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 38px; font-weight: 700; color: #fff; letter-spacing: .4px;
    padding: 3px 17px 5px; border-radius: 8px;
    background: rgba(9,10,12,.8);
    text-shadow: 0 2px 0 rgba(0,0,0,.9);
    white-space: nowrap;
  }
  .human .tag { bottom: 132px; left: 44%; }
  .bot .tag { bottom: -58px; }
</style>
</head>
<body>
<div id="post">

  <div class="card">
    <div class="who">
      <div class="pic"><img src="foto-vilmar.jpg" alt=""></div>
      <div>
        <div class="name">Vilmar Junior</div>
        <div class="handle">@vilmarjunior.adv</div>
      </div>
    </div>
    <div class="quote">
      <span class="cliente">“Doutor, preciso de ajuda no meu caso, você atua nessa área?”</span>
      <span>Eu: Claro, eu e a minha equipe vamos cuidar disso</span>
    </div>
  </div>

  <div class="scene">
    <div class="floor"></div>
    <div class="row">
      <div class="human">
        <img src="foto-vilmar.jpg" alt="Vilmar Junior">
        <div class="tag">Eu</div>
      </div>
      <div class="bots" id="bots"></div>
    </div>
  </div>

</div>

<script>
/* ------------------------------------------------------------------
   Gerador de robôs em SVG.
   Corpo comum (metal, articulações, painéis) + assinatura de cada IA:
   cor, crista, visor, emblema no peito, pose dos braços e acessório.
   ------------------------------------------------------------------ */
const BODY = { headTop: 30, shoulderY: 180, hipY: 330, legY: 372, footY: 578 };

function robot(o) {
  const id = o.id;
  const padL = o.padL || 0;              // espaço extra p/ braço esticado
  const VBW = 240 + padL, VBH = 600;

  /* braço: ombro -> cotovelo -> antebraço -> mão (com dobra independente) */
  const arm = (side, ang, foreAng, prop) => {
    const x = side === 'l' ? 66 : 174;
    const dir = side === 'l' ? -1 : 1;
    return `
      <g transform="translate(${x} ${BODY.shoulderY}) rotate(${ang})">
        <ellipse rx="23" ry="22" fill="url(#g-${id}-ball)" stroke="#000" stroke-opacity=".45"/>
        <rect x="-13" y="6" width="26" height="80" rx="11" fill="url(#g-${id}-limb)" stroke="#000" stroke-opacity=".4"/>
        <g transform="translate(0 92) rotate(${foreAng})">
          <ellipse rx="15" ry="15" fill="url(#g-${id}-ball)" stroke="#000" stroke-opacity=".45"/>
          <rect x="-11" y="10" width="22" height="72" rx="10" fill="url(#g-${id}-limb)" stroke="#000" stroke-opacity=".4"/>
          <g transform="translate(0 86)">
            <path d="M-13 -6 h26 v22 q0 12 -13 12 t-13 -12 z" fill="url(#g-${id}-limb)" stroke="#000" stroke-opacity=".4"/>
            <rect x="${dir === -1 ? -21 : -5}" y="10" width="26" height="9" rx="4.5" fill="url(#g-${id}-dark)"/>
          </g>
          ${prop || ''}
        </g>
      </g>`;
  };

  const leg = (x, ang) => `
    <g transform="translate(${x} ${BODY.legY}) rotate(${ang})">
      <rect x="-23" y="-10" width="46" height="94" rx="20" fill="url(#g-${id}-limb)" stroke="#000" stroke-opacity=".4"/>
      <ellipse cy="90" rx="20" ry="19" fill="url(#g-${id}-ball)" stroke="#000" stroke-opacity=".45"/>
      <rect x="-18" y="100" width="36" height="80" rx="15" fill="url(#g-${id}-limb)" stroke="#000" stroke-opacity=".4"/>
      <path d="M-19 180 h38 q10 0 12 14 q1 10 -9 10 h-46 q-9 0 -8 -10 q2 -14 12 -14 z"
            fill="url(#g-${id}-dark)" stroke="#000" stroke-opacity=".5"/>
    </g>`;

  return `
  <svg width="${VBW * o.scale}" height="${VBH * o.scale}" viewBox="${-padL} 0 ${VBW} ${VBH}"
       xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g-${id}-body" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${o.hi}"/><stop offset=".45" stop-color="${o.mid}"/><stop offset="1" stop-color="${o.lo}"/>
      </linearGradient>
      <linearGradient id="g-${id}-limb" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="${o.lo}"/><stop offset=".34" stop-color="${o.mid}"/><stop offset="1" stop-color="${o.lo}"/>
      </linearGradient>
      <radialGradient id="g-${id}-ball" cx=".33" cy=".3" r=".85">
        <stop offset="0" stop-color="${o.hi}"/><stop offset="1" stop-color="${o.lo}"/>
      </radialGradient>
      <linearGradient id="g-${id}-dark" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${o.lo}"/><stop offset="1" stop-color="#0a0b0d"/>
      </linearGradient>
      <filter id="f-${id}-glow" x="-90%" y="-90%" width="280%" height="280%">
        <feGaussianBlur stdDeviation="5.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    ${arm('l', o.armL, o.foreL, o.propL)}
    ${leg(96, 1)} ${leg(146, -1)}

    <!-- quadril -->
    <rect x="84" y="${BODY.hipY}" width="74" height="50" rx="18" fill="url(#g-${id}-dark)" stroke="#000" stroke-opacity=".45"/>
    <rect x="96" y="${BODY.hipY + 8}" width="50" height="10" rx="5" fill="#000" opacity=".35"/>

    <!-- tronco -->
    <path d="M80 170 q41 -19 82 0 l12 90 q-8 76 -53 76 t-53 -76 z"
          fill="url(#g-${id}-body)" stroke="#000" stroke-opacity=".45"/>
    <path d="M121 172 v160" stroke="#000" stroke-opacity=".26" stroke-width="2"/>
    <path d="M96 296 h50 M100 312 h42" stroke="#000" stroke-opacity=".3" stroke-width="7" stroke-linecap="round"/>
    <g transform="translate(121 228)">
      <circle r="33" fill="#0c0d10" stroke="${o.accent}" stroke-opacity=".5" stroke-width="2"/>
      <g filter="url(#f-${id}-glow)">${o.badge}</g>
    </g>

    <!-- ombros -->
    <ellipse cx="72" cy="${BODY.shoulderY - 4}" rx="28" ry="26" fill="url(#g-${id}-ball)" stroke="#000" stroke-opacity=".45"/>
    <ellipse cx="170" cy="${BODY.shoulderY - 4}" rx="28" ry="26" fill="url(#g-${id}-ball)" stroke="#000" stroke-opacity=".45"/>

    <!-- pescoço -->
    <rect x="109" y="140" width="24" height="36" rx="10" fill="url(#g-${id}-dark)"/>

    <!-- cabeça -->
    ${o.crest}
    <path d="${o.skull}" fill="url(#g-${id}-body)" stroke="#000" stroke-opacity=".45"/>
    <path d="${o.face}" fill="#0d0e11"/>
    <g filter="url(#f-${id}-glow)">${o.eyes}</g>
    <ellipse cx="75" cy="108" rx="9" ry="15" fill="url(#g-${id}-dark)"/>
    <ellipse cx="167" cy="108" rx="9" ry="15" fill="url(#g-${id}-dark)"/>

    ${arm('r', o.armR, o.foreR, o.propR)}
  </svg>`;
}

/* ---------------- CLAUDE — terracota, cabeça arredondada, mão no meu ombro --------- */
const CLAUDE = {
  id: 'cl', scale: .97, padL: 152,
  hi: '#f2a98d', mid: '#cf6b4c', lo: '#753725', accent: '#ffd9b6',
  skull: 'M121 56 q42 0 47 34 l4 30 q0 35 -51 35 t-51 -35 l4 -30 q5 -34 47 -34 z',
  face:  'M85 98 q36 -14 72 0 l-3 22 q-33 12 -66 0 z',
  eyes:  `<rect x="95" y="102" width="21" height="11" rx="5.5" fill="#ffdcbc"/>
          <rect x="126" y="102" width="21" height="11" rx="5.5" fill="#ffdcbc"/>`,
  crest: `<g stroke="#c25f42" stroke-width="8" stroke-linecap="round">
            <path d="M121 24 v22"/><path d="M99 32 l12 18"/><path d="M143 32 l-12 18"/>
          </g>`,
  badge: `<g stroke="#ff9f6e" stroke-width="5.5" stroke-linecap="round">
            <path d="M0 -18 V18"/><path d="M-15.5 -9 L15.5 9"/><path d="M-15.5 9 L15.5 -9"/>
          </g>`,
  armL: 45, foreL: 22, propL: '',        // braço esticado, mão no meu ombro
  armR: -10, foreR: 6, propR: ''
};

/* ---------------- GPT — grafite/branco, mais alto, cabeça angular ----------------- */
const GPT = {
  id: 'gp', scale: 1.05,
  hi: '#f1f5f7', mid: '#98a4ad', lo: '#363d44', accent: '#7ef0d2',
  skull: 'M89 56 h64 q19 0 19 19 v40 q0 21 -21 21 h-60 q-21 0 -21 -21 V75 q0 -19 19 -19 z',
  face:  'M86 94 h70 v26 q0 9 -11 9 h-48 q-11 0 -11 -9 z',
  eyes:  `<rect x="92" y="102" width="58" height="10" rx="5" fill="#8ff3d8"/>`,
  crest: `<rect x="97" y="36" width="48" height="12" rx="6" fill="#5f696f"/>
          <rect x="117" y="18" width="8" height="20" rx="4" fill="#5f696f"/>
          <circle cx="121" cy="14" r="7" fill="#8ff3d8"/>`,
  badge: `<g fill="none" stroke="#dcfff5" stroke-width="4.5" stroke-linejoin="round">
            <path d="M0 -19 L16.5 -9.5 V9.5 L0 19 L-16.5 9.5 V-9.5 Z"/>
            <path d="M0 -19 V0 L16.5 9.5 M0 0 L-16.5 9.5"/>
          </g>`,
  armL: 5, foreL: 4, propL: '',
  armR: -6, foreR: -4, propR: ''
};

/* ---------------- JUS IA — metal claro, visor verde, pasta na mão ---------------- */
const JUSIA = {
  id: 'ju', scale: .99,
  hi: '#e2e9ec', mid: '#7d8b93', lo: '#283036', accent: '#33c46a',
  skull: 'M121 54 q47 0 47 40 v22 q0 25 -47 25 t-47 -25 V94 q0 -40 47 -40 z',
  face:  'M81 92 q40 -16 80 0 l-4 26 q-36 14 -72 0 z',
  eyes:  `<circle cx="101" cy="106" r="8.5" fill="#3fe07d"/>
          <circle cx="141" cy="106" r="8.5" fill="#3fe07d"/>
          <rect x="113" y="122" width="16" height="6" rx="3" fill="#3fe07d" opacity=".8"/>`,
  crest: `<path d="M121 22 q27 8 31 34 h-62 q4 -26 31 -34 z" fill="#3a444b"/>
          <rect x="113" y="12" width="16" height="16" rx="4" fill="#3fe07d"/>`,
  badge: `<g>
            <rect x="-18" y="-18" width="36" height="36" rx="8" fill="#0d0f12"/>
            <path d="M-12 -12 h10 v15 q0 7 -7 7 h-6 v-8 h3 q0 0 0 -3 z" fill="#3ec46a"/>
            <rect x="1" y="-12" width="11" height="11" rx="2" fill="#f5c518"/>
            <rect x="1" y="1" width="11" height="11" rx="2" fill="#2f7de1"/>
          </g>`,
  armL: 12, foreL: 8, propL: '',
  armR: -4, foreR: 4,
  propR: `<g transform="translate(2 100)">
            <path d="M-6 -12 q6 -12 12 0" fill="none" stroke="#aeb8bd" stroke-width="4"/>
            <rect x="-30" y="-10" width="60" height="46" rx="6" fill="#1d2429" stroke="#0a0c0e"/>
            <rect x="-30" y="4" width="60" height="5" fill="#3ec46a" opacity=".85"/>
            <rect x="-8" y="0" width="16" height="12" rx="3" fill="#4b565c"/>
          </g>`
};

if (location.search.includes('story')) document.body.classList.add('story');

document.getElementById('bots').innerHTML = [
  { cfg: CLAUDE, label: 'Claude', shift: -176 },
  { cfg: GPT,    label: 'GPT',    shift: -26  },
  { cfg: JUSIA,  label: 'Jus IA', shift: -26  },
].map(b =>
  `<div class="bot" style="margin-left:${b.shift}px">${robot(b.cfg)}<div class="tag">${b.label}</div></div>`
).join('');
</script>
</body>
</html>
